<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestones | CC HQ</title>
    <link rel="shortcut icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/workspace-refinements.css">

    <!-- EARLY ACCESS GATE -->
    <!-- Handled in init() via DataManager -->
    <style>
        :root {
            --accent-gold: #ffd700;
            --accent-neon: #00f3ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: #05050a;
            color: #fff;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .premium-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-box .label {
            font-family: 'Orbitron';
            font-size: 0.55rem;
            opacity: 0.5;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-family: 'Orbitron';
            font-size: 1.2rem;
            color: var(--accent-neon);
            font-weight: bold;
        }

        /* --- UI NAVIGATION REFINEMENT --- */
        .achievements-filter-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .sub-nav-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'Orbitron';
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 120px;
        }

        .sub-nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .sub-nav-btn.active {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--accent-neon);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .sub-nav-btn i {
            font-size: 0.9rem;
        }

        /* --- CARD REFINEMENT --- */
        .milestone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .milestone-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        /* --- HEADER NAVIGATION BUTTON (BACK) --- */
        .cockpit-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            padding: 10px 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            text-transform: uppercase;
            text-decoration: none;
        }

        .cockpit-btn:hover {
            background: var(--accent-neon);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        .milestone-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .milestone-card:hover::before {
            transform: translateX(100%);
        }

        .milestone-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .milestone-card.unlocked {
            border-color: rgba(255, 215, 0, 0.2);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), rgba(255, 215, 0, 0.01));
        }

        .milestone-card.locked {
            opacity: 0.7;
        }

        .milestone-card.locked .milestone-badge {
            filter: grayscale(1);
            opacity: 0.5;
        }

        /* --- PROGRESS BAR --- */
        .milestone-progress-container {
            margin-top: 10px;
        }

        .progress-label-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            font-family: 'Orbitron';
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-gold));
            width: 0%;
            transition: width 1s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .tier-carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tier-nav-btn {
            background: transparent;
            border: none;
            color: var(--accent-neon);
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: 0.3s;
            opacity: 0.6;
        }

        .tier-nav-btn:hover:not(:disabled) {
            opacity: 1;
            transform: scale(1.1);
        }

        .tier-nav-btn:disabled {
            opacity: 0.1;
            cursor: not-allowed;
        }

        .milestone-badge {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.03);
            margin: 0 auto;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .milestone-badge::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: url('/assets/favicon.png') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.4));
            border-radius: 50%;
            background-color: #05050a;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .share-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .share-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-family: 'Orbitron';
            font-size: 0.6rem;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .share-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--accent-neon);
            color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .share-btn.global:hover {
            background: rgba(255, 0, 60, 0.1);
            border-color: #ff003c;
            color: #ff003c;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.1);
        }

        /* --- SHARE MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .share-modal {
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.05);
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .modal-overlay.active .share-modal {
            transform: scale(1) translateY(0);
        }

        .modal-icon-wrap {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
        }

        .share-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            resize: none;
            margin: 20px 0;
            outline: none;
            transition: border-color 0.3s;
        }

        .share-textarea:focus {
            border-color: var(--accent-neon);
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-btn-row {
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Orbitron';
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-btn.cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }

        .modal-btn.confirm {
            background: var(--accent-neon);
            border: none;
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .modal-btn.confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(0, 243, 255, 0.5);
        }

        /* Mobile specific overrides */
        @media (max-width: 768px) {
            .milestone-grid {
                grid-template-columns: 1fr;
            }

            .achievements-filter-nav {
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .sub-nav-btn {
                min-width: 100px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- WORKSPACE HEADER -->
    <header class="workspace-header">
        <div class="brand-sec">
            <img src="/assets/favicon.png" alt="CC">
            <span class="orbitron">COFFEE<span style="color:var(--accent-primary)">CREWS</span></span>
        </div>
        <div class="header-right">
            <button class="cockpit-btn" onclick="location.href='verify.html'">
                <i class="fas fa-arrow-left"></i> BACK TO WORKSPACE
            </button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="profile-sidebar">
            <div class="identity-card">
                <div class="photo-wrapper">
                    <img id="p-photo" src="/assets/placeholder-user.png" alt="Profile">
                </div>
                <div class="profile-details">
                    <div class="name-tag" id="p-name">LOADING...</div>
                    <div class="role-tag" id="p-role">SECURE ACCESS</div>
                    <div class="stat-pills" style="margin-top:20px;">
                        <div class="stat-pill">
                            <i class="fas fa-shield"></i>
                            <span id="p-id">CC-0000</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="dashboard-main">
            <div class="workspace-section active">
                <!-- MISSION SUMMARY CARD -->
                <div class="premium-card" style="margin-bottom: 30px; border-color: var(--accent-gold);">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                        <div>
                            <h2 class="orbitron" style="margin: 0; font-size: 1.2rem; color: var(--accent-gold);">
                                <i class="fas fa-microchip"></i> COLLECTOR'S CORE
                            </h2>
                            <p style="font-size: 0.7rem; opacity: 0.5; margin: 5px 0 0 0;">SYSTEM SYNCHRONIZATION:
                                ACTIVE</p>
                        </div>
                        <div style="text-align: right;">
                            <div id="achievement-count-label" class="orbitron" style="font-size: 1.2rem; color: #fff;">0
                                / 20</div>
                            <div style="font-size: 0.55rem; opacity: 0.5; letter-spacing: 2px;">MILESTONES UNLOCKED
                            </div>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="label">ATTENDANCE STREAK</div>
                            <div id="stat-max-streak" class="value">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">STATUS COMMITS</div>
                            <div id="stat-drafts" class="value">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">LATE LOGINS</div>
                            <div id="stat-lates" class="value" style="color: #ff003c;">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="label">TENURE RADIUS</div>
                            <div id="stat-tenure" class="value" style="color: var(--accent-gold);">0.0 YR</div>
                        </div>
                    </div>

                    <div class="progress-bar-bg" style="height: 10px; background: rgba(0,0,0,0.4);">
                        <div id="overall-progress-fill" class="progress-bar-fill" style="width: 0%; height: 100%;">
                        </div>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="achievements-filter-nav"
                    style="display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; flex-wrap: wrap;">
                    <button class="sub-nav-btn active" onclick="setFilter('all')" id="filter-btn-all"
                        style="flex: 1; min-width: 120px;">ALL</button>
                    <button class="sub-nav-btn" onclick="setFilter('unlocked')" id="filter-btn-unlocked"
                        style="flex: 1; min-width: 120px; color: #3cff7d;"><i class="fas fa-unlock"></i>
                        UNLOCKED</button>
                    <button class="sub-nav-btn" onclick="setFilter('locked')" id="filter-btn-locked"
                        style="flex: 1; min-width: 120px; color: #ff003c;"><i class="fas fa-lock"></i> LOCKED</button>
                </div>

                <div id="achievements-grid"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;">
                    <!-- Injected by script -->
                </div>
            </div>
        </main>
    </div>

    <!-- SHARE MODAL -->
    <div class="modal-overlay" id="share-modal-overlay">
        <div class="share-modal">
            <h2 class="orbitron" style="font-size: 1.2rem; margin-bottom: 25px; color: var(--accent-neon);">🚀 SHARE
                MILESTONE</h2>
            <div class="modal-icon-wrap" id="modal-badge">
                <i class="fas" id="modal-icon"></i>
            </div>
            <h3 class="orbitron" id="modal-title" style="font-size: 0.9rem; margin: 10px 0;"></h3>

            <textarea id="share-message" class="share-textarea" rows="4"
                placeholder="Add a custom message..."></textarea>

            <div class="modal-btn-row">
                <button class="modal-btn cancel" onclick="closeShareModal()">CANCEL</button>
                <button class="modal-btn confirm" id="confirm-share-btn">POST NOW</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/data.js"></script>

    <script>
        let currentUser = null;
        let currentFilter = 'all';
        let userAchievements = [];

        async function refreshData() {
            if (!currentUser) return;
            const session = JSON.parse(sessionStorage.getItem('cc_session') || localStorage.getItem('cc_session') || '{}');
            currentUser = await window.DataManager.getMemberById(session.id);
            userAchievements = currentUser.achievements || [];

            // Update Header Stats
            const streak = currentUser.streak || 0;
            const drafts = currentUser.vocalistCount || 0;
            const lates = currentUser.lateCount || 0;
            const tenure = currentUser.tenure || 0;

            document.getElementById('stat-max-streak').textContent = streak;
            document.getElementById('stat-drafts').textContent = drafts;
            document.getElementById('stat-lates').textContent = lates;
            document.getElementById('stat-tenure').textContent = tenure.toFixed(1) + ' YR';

            const totalMilestones = Object.keys(window.ACHIEVEMENT_DEFINITIONS).length;
            const unlockedCount = userAchievements.length;
            const overallPct = (unlockedCount / totalMilestones) * 100;
            document.getElementById('overall-progress-fill').style.width = overallPct + '%';

            renderMilestones();
        }

        async function init() {
            // Wait for DataManager to be ready (from data.js)
            if (!window.DataManager) {
                setTimeout(init, 100);
                return;
            }

            // ADD LIVE LISTENERS FOR REACTIVITY
            window.addEventListener('cc_achievement_unlocked', () => {
                refreshData();
            });

            window.addEventListener('coffeecrews_data_update', (e) => {
                if (currentUser && e.detail && e.detail.id === currentUser.id) {
                    refreshData();
                }
            });

            const isUnlocked = await window.DataManager.checkMilestonesUnlockStatus();
            if (!isUnlocked) {
                window.location.replace("verify.html");
                return;
            }

            const session = JSON.parse(sessionStorage.getItem('cc_session') || localStorage.getItem('cc_session') || '{}');
            if (!session.id) {
                console.error("No session found, redirecting to login.");
                location.href = 'login.html';
                return;
            }

            try {
                // Show initial loading state
                const grid = document.getElementById('achievements-grid');
                if (grid) grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; opacity: 0.5; padding: 50px;"><i class="fas fa-sync fa-spin"></i> SYNCING HISTORICAL DATA...</div>';

                currentUser = await window.DataManager.getMemberById(session.id);
                if (!currentUser) {
                    console.error("Member not found for ID:", session.id);
                    return;
                }

                // Run checkAll to ensure latest unlocks are captured and stats are synced
                if (window.AchievementsEngine) {
                    const stats = await window.AchievementsEngine.checkAll(session.id);
                    if (stats) {
                        // Merge stats into currentUser for immediate rendering
                        Object.assign(currentUser, stats);
                        userAchievements = stats.achievements || [];
                    } else {
                        userAchievements = currentUser.achievements || [];
                    }
                } else {
                    userAchievements = currentUser.achievements || [];
                }

                // Update Sidebar
                const pName = document.getElementById('p-name');
                const pRole = document.getElementById('p-role');
                const pId = document.getElementById('p-id');
                const pPhoto = document.getElementById('p-photo');

                if (pName) pName.textContent = (currentUser.name || 'UNKNOWN').toUpperCase();
                if (pRole) pRole.textContent = (currentUser.role || 'MEMBER').toUpperCase();
                if (pId) pId.textContent = 'CC-' + (currentUser.id || 'XXXX');
                if (pPhoto) pPhoto.src = currentUser.image || '/assets/placeholder-user.png';

                // Update Stats
                const streak = currentUser.streak || 0;
                const drafts = currentUser.vocalistCount || 0;
                const lates = currentUser.lateCount || 0;
                const tenure = currentUser.tenure || 0;

                document.getElementById('stat-max-streak').textContent = streak;
                document.getElementById('stat-drafts').textContent = drafts;
                document.getElementById('stat-lates').textContent = lates;
                document.getElementById('stat-tenure').textContent = tenure.toFixed(1) + ' YR';

                const totalMilestones = Object.keys(window.ACHIEVEMENT_DEFINITIONS).length;
                const unlockedCount = userAchievements.length;
                const overallPct = (unlockedCount / totalMilestones) * 100;

                document.getElementById('overall-progress-fill').style.width = overallPct + '%';

                renderMilestones();
            } catch (e) {
                console.error("Init failed:", e);
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('filter-btn-' + f).classList.add('active');
            renderMilestones();
        }

        const getProgressValue = (statKey) => {
            if (!currentUser) return 0;
            switch (statKey) {
                case 'streak': return currentUser.streak || 0;
                case 'vocalistCount': return currentUser.vocalistCount || 0;
                case 'lateCount': return currentUser.lateCount || 0;
                case 'tenure':
                    const joinDate = new Date(currentUser.timestamp || Date.now());
                    return (new Date() - joinDate) / (1000 * 60 * 60 * 24 * 365.25);
                case 'passcode': return currentUser.passcodeChanged ? 1 : 0;
                case 'monthly': return (userAchievements || []).includes('monthly_perfect') ? 1 : 0;
                default: return 0;
            }
        };

        const getProgressStats = (item) => {
            const isUnlocked = userAchievements.includes(item.id);
            const target = item.target || 1;
            const rawVal = getProgressValue(item.statKey);

            let progress = Math.min((rawVal / target) * 100, 100);
            let text = "";

            if (item.statKey === 'tenure') {
                text = `${rawVal.toFixed(1)} / ${target} YR`;
            } else if (item.statKey === 'passcode' || item.statKey === 'monthly') {
                text = isUnlocked ? "COMPLETED" : "LOCKED";
            } else {
                text = `${Math.floor(rawVal)} / ${target}`;
            }

            return { progress, text };
        };

        function renderMilestones() {
            const grid = document.getElementById('achievements-grid');
            const label = document.getElementById('achievement-count-label');
            if (!grid || !window.ACHIEVEMENT_DEFINITIONS) return;

            const categories = {};
            Object.entries(ACHIEVEMENT_DEFINITIONS).forEach(([id, def]) => {
                const cat = def.category || 'misc';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({ id, ...def });
            });

            let html = '';
            let totalUnlocked = 0;

            Object.entries(categories).forEach(([cat, items]) => {
                const unlockedItems = items.filter(it => userAchievements.includes(it.id));
                totalUnlocked += unlockedItems.length;

                if (currentFilter === 'unlocked' && unlockedItems.length === 0) return;
                if (currentFilter === 'locked' && unlockedItems.length === items.length) return;

                if (categoryState[cat] === undefined) {
                    categoryState[cat] = unlockedItems.length > 0 ? unlockedItems.length - 1 : 0;
                }

                const idx = categoryState[cat];
                const item = items[idx];
                const stats = getProgressStats(item);
                const isUnlocked = userAchievements.includes(item.id);

                html += `
                    <div class="milestone-card ${isUnlocked ? 'unlocked' : 'locked'}" id="card-${cat}">
                        <div class="milestone-badge" style="color: ${item.color}; border: 1px solid ${item.color}33;">
                            <i class="fas ${item.icon}"></i>
                        </div>
                        <div style="text-align: center;">
                            <h3 class="orbitron" style="font-size: 1.1rem; margin: 10px 0;">${item.title}</h3>
                            <p style="font-size: 0.7rem; opacity: 0.6; height: 3em; margin: 0;">${item.desc}</p>
                        </div>

                        <div class="milestone-progress-container">
                            <div class="progress-label-wrap">
                                <span>PROGRESS</span>
                                <span class="progress-val">${stats.text}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${stats.progress}%; background: ${item.color};"></div>
                            </div>
                        </div>

                        ${items.length > 1 ? `
                        <div class="tier-carousel">
                            <button class="tier-nav-btn" onclick="cycleTier('${cat}', -1)" ${idx === 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>
                            <span style="font-family: 'Orbitron'; font-size: 0.55rem; opacity: 0.7;">TIER ${idx + 1} / ${items.length}</span>
                            <button class="tier-nav-btn" onclick="cycleTier('${cat}', 1)" ${idx === items.length - 1 ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>
                        </div>
                        ` : ''}

                        <div class="share-actions" style="display: ${isUnlocked ? 'flex' : 'none'}">
                            <button class="share-btn" onclick="shareToStatus('${item.id}')"><i class="fas fa-file-signature"></i> FEED</button>
                            <button class="share-btn global" onclick="shareToGlobal('${item.id}')"><i class="fas fa-globe"></i> GLOBAL</button>
                        </div>

                        ${!isUnlocked ? `<div class="lock-tag" style="text-align: center; font-family: 'Orbitron'; font-size: 0.55rem; color: #ff003c; margin-top: 5px; opacity: 0.6;"><i class="fas fa-lock"></i> SECURED</div>` : ''}
                    </div>
                `;
            });

            grid.innerHTML = html || '<div style="grid-column: 1/-1; text-align: center; opacity: 0.3; padding: 50px;">No milestones found.</div>';
            label.textContent = `${totalUnlocked} / ${Object.keys(ACHIEVEMENT_DEFINITIONS).length} UNLOCKED`;
        }

        const categoryState = {};
        window.cycleTier = (cat, dir) => {
            const items = Object.values(ACHIEVEMENT_DEFINITIONS).filter(d => d.category === cat);
            categoryState[cat] = (categoryState[cat] || 0) + dir;
            categoryState[cat] = Math.max(0, Math.min(categoryState[cat], items.length - 1));
            renderMilestones(); // Re-render is safer for progress bar updates
        };

        // Share Modal Logic
        let activeShareContext = null;

        function openShareModal(id, type) {
            const def = window.ACHIEVEMENT_DEFINITIONS[id];
            if (!def) return;

            activeShareContext = { id, type };
            const overlay = document.getElementById('share-modal-overlay');
            const icon = document.getElementById('modal-icon');
            const badge = document.getElementById('modal-badge');
            const title = document.getElementById('modal-title');
            const textarea = document.getElementById('share-message');

            icon.className = `fas ${def.icon}`;
            badge.style.color = def.color;
            badge.style.boxShadow = `0 0 25px ${def.color}33`;
            title.textContent = def.title.toUpperCase();

            textarea.value = type === 'feed'
                ? `🏆 MILESTONE UNLOCKED: ${def.title} — ${def.desc}`
                : `🚀 I just unlocked the ${def.title} milestone at CoffeeCrews HQ!`;

            overlay.classList.add('active');
        }

        window.closeShareModal = () => {
            document.getElementById('share-modal-overlay').classList.remove('active');
            activeShareContext = null;
        };

        document.getElementById('confirm-share-btn').onclick = async () => {
            if (!activeShareContext) return;
            const { id, type } = activeShareContext;
            const message = document.getElementById('share-message').value;
            const btn = document.getElementById('confirm-share-btn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SENDING...';

            try {
                if (type === 'feed') {
                    await window.DataManager.commitStatus(currentUser.id, currentUser.name, message, currentUser.image);
                } else {
                    await window.DataManager.sendGlobalMessage(currentUser.id, currentUser.name, message);
                }
                closeShareModal();
                alert('Shared successfully!');
            } catch (e) {
                alert('Sharing failed.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'POST NOW';
            }
        };

        function shareToStatus(id) {
            openShareModal(id, 'feed');
        }

        function shareToGlobal(id) {
            openShareModal(id, 'global');
        }

        init();
    </script>
</body>
