<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth | COFFEECREWS</title>
    <link rel="shortcut icon" href="/assets/favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-primary: #00f3ff;
            --accent-red: #ff003c;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            text-align: center;
            z-index: 10;
        }

        .hq-logo {
            height: 60px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.3));
        }

        .id-scanner {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
            position: relative;
            margin-bottom: 2rem;
        }

        .scanner-frame {
            width: 150px;
            height: 150px;
            border: 2px solid var(--accent-primary);
            margin: 0 auto 1.5rem;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .scanner-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            transition: 0.3s;
        }

        .scanner-frame img.detected {
            opacity: 1;
            mix-blend-mode: normal;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
            }

            50% {
                top: 100%;
            }

            100% {
                top: 0;
            }
        }

        #status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--accent-primary);
            text-transform: uppercase;
        }

        .input-card {
            display: none;
            margin-top: 1.5rem;
            animation: slideUp 0.5s ease forwards;
        }

        .input-card.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-auth:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 20px var(--accent-primary);
        }

        .manual-trigger {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        .member-dropdown {
            display: none;
            width: 100%;
            background: #111;
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="auth-container">
        <img src="/assets/favicon.png" class="hq-logo" alt="CoffeeCrews Logo">

        <div class="id-scanner">
            <div class="scanner-frame">
                <img src="/assets/crews/placeholder.png" id="scanned-id" alt="ID Card">
                <div class="scanner-line"></div>
            </div>
            <div id="status-text">Scanning Personnel...</div>

            <div id="person-info" style="margin-top: 1.5rem; display: none;">
                <h2 id="person-name" style="margin:0; font-family:'Orbitron'; font-size: 1.4rem;"></h2>
                <p id="person-role"
                    style="opacity: 0.5; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;"></p>
            </div>

            <div class="input-card" id="input-card">
                <input type="password" id="cc-code" placeholder="ENTER CC-CODE" maxlength="8">
                <button onclick="handleAuth()" class="btn-auth" id="auth-btn">Authorize Access</button>
            </div>
        </div>

        <select id="member-select" class="member-dropdown" onchange="detectPersonFromSelect(this.value)">
            <option value="">Select Identity...</option>
        </select>
        <div class="manual-trigger" onclick="toggleManual()">Manual Identifier Override</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/admin/id-card/js/data.js"></script>
    <script src="/admin/js/tactical-notifications.js"></script>

    <script>
        let members = [];
        let currentMember = null;
        let scanInterval = null;

        document.addEventListener('DOMContentLoaded', async () => {
            members = await DataManager.getAllMembers();
            populateSelect();
            startScanning();
        });

        function populateSelect() {
            const select = document.getElementById('member-select');
            members.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                select.appendChild(opt);
            });
        }

        function startScanning() {
            let i = 0;
            const photo = document.getElementById('scanned-id');
            scanInterval = setInterval(() => {
                photo.src = members[i % members.length].image;
                i++;
            }, 300);
        }

        function detectPersonFromSelect(id) {
            const member = members.find(m => m.id === id);
            if (member) detectPerson(member);
        }

        function detectPerson(member) {
            if (scanInterval) clearInterval(scanInterval);
            currentMember = member;

            const photo = document.getElementById('scanned-id');
            photo.src = member.image;
            photo.classList.add('detected');

            document.getElementById('status-text').innerHTML = "Personnel Identified";
            document.getElementById('status-text').style.color = "#0aff0a";

            document.getElementById('person-info').style.display = "block";
            document.getElementById('person-name').innerText = member.name;
            document.getElementById('person-role').innerText = member.role;

            document.getElementById('input-card').classList.add('show');
            document.getElementById('cc-code').focus();
        }

        function toggleManual() {
            const dropdown = document.getElementById('member-select');
            const isVisible = dropdown.style.display === 'block';
            dropdown.style.display = isVisible ? 'none' : 'block';
        }

        async function handleAuth() {
            const codeInput = document.getElementById('cc-code').value;
            const btn = document.getElementById('auth-btn');

            if (!currentMember) return;

            const cleanCode = codeInput.toUpperCase().replace('CC-', '');

            if (cleanCode === currentMember.ccCode) {
                btn.innerHTML = "<i class='fas fa-check'></i> ACCESS GRANTED";
                btn.style.background = "#0aff0a";
                btn.style.color = "#000";

                const dualAccessIds = ['vishnu', 'prasanna', 'dharani'];
                const role = (dualAccessIds.includes(currentMember.id) || currentMember.access === 'admin') ? 'admin' : 'crew';

                localStorage.setItem('cc_session', JSON.stringify({
                    id: currentMember.id,
                    role: role,
                    name: currentMember.name,
                    timestamp: Date.now()
                }));

                showTacticalNotification(`AUTHORIZATION SUCCESS: Welcome Commander ${currentMember.name}`, 'success');

                setTimeout(() => {
                    if (role === 'admin') {
                        location.href = '/admin/index.html';
                    } else {
                        location.href = `/admin/id-card/verify.html?id=${currentMember.id}`;
                    }
                }, 1500);
            } else {
                showTacticalNotification('INVALID CC CODE: Personnel record not match', 'error');
                gsap.to('.id-scanner', { x: 10, repeat: 5, yoyo: true, duration: 0.05 });
            }
        }
    </script>
</body>

</html>
