<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Member | CoffeeCrews Admin</title>
    <link rel="shortcut icon" href="assets/favicon.png">
    <link rel="stylesheet" href="/admin/id-card/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="top-nav" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
        <a href="/index.html" class="nav-brand">
            <img src="/assets/logo/mainlogo.jpeg" alt="CoffeeCrews Logo" class="nav-main-logo">
        </a>
        <div class="nav-links">
            <a href="/admin/index.html" class="nav-link"><i class="fas fa-th-large"></i> COCKPIT</a>
            <span class="nav-link active"><i class="fas fa-edit"></i> EDITOR</span>
        </div>
    </nav>

    <div class="edit-container" style="padding-top: 0; margin-top: 2rem;">
        <!-- Sidebar: Form -->
        <div class="edit-sidebar glass">
            <h1
                style="font-family: 'Outfit'; font-weight: 700; font-size: 1.8rem; letter-spacing: 1px; margin-bottom: 2rem; color: #fff;">
                PERSONNEL <span style="color: var(--accent-primary);">EDITOR</span></h1>

            <form id="editForm">
                <div class="form-group">
                    <label>PROFILE IMAGE URL</label>
                    <input type="text" id="editImage" placeholder="/assets/name.jpg" required>
                    <p style="font-size: 0.7rem; opacity: 0.5; margin-top: 5px;">Tip: Use root-relative paths like
                        "/assets/name.jpg" or full URLs.</p>
                </div>

                <div class="form-group">
                    <label>FULL NAME</label>
                    <input type="text" id="editName" required>
                </div>

                <div class="form-group">
                    <label>DESIGNATION / ROLE</label>
                    <input type="text" id="editRole" required>
                </div>

                <div class="form-group">
                    <label>BIOGRAPHY / DESCRIPTION</label>
                    <textarea id="editDesc" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label>ACCENT COLOR (HEX)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="editAccent" required style="flex: 1;">
                        <input type="color" id="colorPicker"
                            style="width: 50px; height: 49px; padding: 0; border: none; background: none; cursor: pointer;">
                    </div>
                </div>

                <h3
                    style="font-family: 'Orbitron'; font-size: 1rem; margin: 3rem 0 1rem; color: var(--accent-primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">
                    CONTACT CHANNELS</h3>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> PHONE NUMBER</label>
                    <input type="text" id="editPhone">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> EMAIL ADDRESS</label>
                    <input type="email" id="editEmail">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-globe"></i> PORTFOLIO URL</label>
                    <input type="text" id="editPortfolio">
                </div>

                <div
                    style="display: flex; gap: 15px; margin-top: 4rem; position: sticky; bottom: 0; background: var(--bg-color); padding: 20px 0; border-top: 1px solid var(--glass-border);">
                    <button type="submit" class="btn-primary" style="flex: 1;">Save Configuration</button>
                    <button type="button" id="deleteBtn" class="btn-primary"
                        style="border-color: #ff003c; color: #ff003c;">Delete</button>
                </div>
            </form>
        </div>

        <!-- Preview Pane -->
        <div class="edit-preview-pane">
            <div id="previewCard" class="id-card glass">
                <div class="id-card-photo">
                    <img id="prevImg" src="" alt="Preview">
                </div>
                <div class="id-card-info">
                    <div class="member-role" id="prevRole">ROLE</div>
                    <h1 class="member-name" id="prevName">NAME</h1>
                    <p class="member-desc" id="prevDesc">Description preview goes here...</p>

                    <div id="prevLinks" style="display: flex; gap: 15px;">
                        <!-- Preview icons -->
                    </div>
                </div>
            </div>

            <div
                style="position: absolute; top: 40px; right: 40px; font-family: 'Orbitron'; font-size: 0.7rem; opacity: 0.3; letter-spacing: 5px;">
                LIVE PREVIEW MODE</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="/admin/id-card/js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('id');

            if (!memberId) {
                window.location.href = '/admin/index.html';
                return;
            }

            const member = await DataManager.getMemberById(memberId);
            if (!member) {
                alert('Personnel record not found!');
                window.location.href = '/admin/index.html';
                return;
            }

            await initEditor(member);
        });

        async function initEditor(member) {
            // Fill form
            const fields = {
                editImage: member.image,
                editName: member.name,
                editRole: member.role,
                editDesc: member.description,
                editAccent: member.accent,
                colorPicker: member.accent,
                editPhone: member.contact?.phone || '',
                editEmail: member.contact?.email || '',
                editPortfolio: member.contact?.portfolio || ''
            };

            for (const [id, value] of Object.entries(fields)) {
                const el = document.getElementById(id);
                if (el) el.value = value;
            }

            // Sync color picker with text input
            document.getElementById('editAccent').addEventListener('input', (e) => {
                document.getElementById('colorPicker').value = e.target.value;
                updatePreview();
            });
            document.getElementById('colorPicker').addEventListener('input', (e) => {
                document.getElementById('editAccent').value = e.target.value.toUpperCase();
                updatePreview();
            });

            // Live preview updates
            const inputIds = ['editImage', 'editName', 'editRole', 'editDesc', 'editPhone', 'editEmail', 'editPortfolio'];
            inputIds.forEach(id => {
                document.getElementById(id).addEventListener('input', updatePreview);
            });

            // Initial preview check
            updatePreview();

            // Save logic
            document.getElementById('editForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedData = {
                    image: document.getElementById('editImage').value,
                    name: document.getElementById('editName').value,
                    role: document.getElementById('editRole').value,
                    description: document.getElementById('editDesc').value,
                    accent: document.getElementById('editAccent').value,
                    contact: {
                        phone: document.getElementById('editPhone').value,
                        email: document.getElementById('editEmail').value,
                        portfolio: document.getElementById('editPortfolio').value
                    }
                };

                if (await DataManager.updateMember(member.id, updatedData)) {
                    alert('Changes synchronized successfully!');
                    window.location.href = '/admin/index.html';
                }
            });

            // Delete logic
            document.getElementById('deleteBtn').onclick = async () => {
                if (confirm(`CRITICAL: Are you sure you want to permanently delete ${member.name}'s record?`)) {
                    if (await DataManager.deleteMember(member.id)) {
                        window.location.href = '/admin/index.html';
                    }
                }
            };
        }

        function updatePreview() {
            document.getElementById('prevName').textContent = document.getElementById('editName').value || 'NAME';
            document.getElementById('prevRole').textContent = document.getElementById('editRole').value || 'ROLE';
            document.getElementById('prevDesc').textContent = document.getElementById('editDesc').value || 'Biography...';
            document.getElementById('prevImg').src = document.getElementById('editImage').value;

            const accent = document.getElementById('editAccent').value;
            document.documentElement.style.setProperty('--accent-member', accent);

            // Preview icons
            const linksContainer = document.getElementById('prevLinks');
            linksContainer.innerHTML = '';
            const fields = ['editPhone', 'editEmail', 'editPortfolio'];
            const icons = ['fas fa-phone', 'fas fa-envelope', 'fas fa-globe'];

            fields.forEach((id, i) => {
                if (document.getElementById(id).value) {
                    const icon = document.createElement('i');
                    icon.className = icons[i];
                    icon.style.opacity = '0.5';
                    linksContainer.appendChild(icon);
                }
            });
        }
    </script>
</body>

</html>
