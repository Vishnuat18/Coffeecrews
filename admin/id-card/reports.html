<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | CC HQ</title>
    <script src="../../mobile-redirect.js"></script>
    <link rel="stylesheet" href="/admin/id-card/css/style.css">
    <link rel="shortcut icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-darker: #050505;
            --module-bg: rgba(10, 10, 10, 0.8);
            --module-border: rgba(0, 243, 255, 0.15);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background: radial-gradient(circle at 50% -20%, #0a1012 0%, #050505 100%);
        }

        .reports-feed {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 3rem;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .report-strip {
            display: grid;
            grid-template-columns: 120px 1fr 380px;
            gap: 0;
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            background: var(--module-bg);
            border: 1px solid var(--module-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
        }

        .report-strip::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
            opacity: 0.5;
        }

        .report-strip:hover {
            border-color: rgba(0, 243, 255, 0.4);
        }

        .strip-photo-container {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .strip-photo {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .report-main-content {
            padding: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .report-user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            margin-bottom: 20px;
        }

        .report-user-name {
            font-family: 'Orbitron';
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .report-user-role {
            font-size: 0.6rem;
            color: var(--accent-primary);
            letter-spacing: 2.5px;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .command-center-controls {
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .report-label {
            font-family: 'Orbitron';
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-label i {
            font-size: 0.7rem;
            color: var(--accent-primary);
        }

        .directive-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px;
            color: #fff;
            padding: 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            resize: none;
            transition: 0.3s;
        }

        .directive-input:focus {
            border-color: var(--accent-primary) !important;
            background: rgba(0, 243, 255, 0.03) !important;
        }

        .btn-directive {
            width: 100%;
            height: 45px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-family: 'Orbitron';
            letter-spacing: 1px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-directive:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .pending-badge {
            background: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border: 1px solid rgba(255, 0, 60, 0.3);
            font-size: 0.55rem;
            font-family: 'Orbitron';
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse-red-soft 2s infinite;
        }

        @keyframes pulse-red-soft {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        /* Bank submission status badges */
        .bank-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'Orbitron';
            font-size: 0.5rem;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .bank-status-badge.pending {
            background: rgba(255, 153, 0, 0.12);
            color: #ff9900;
            border: 1px solid rgba(255, 153, 0, 0.35);
            animation: pulse-red-soft 2s infinite;
        }

        .bank-status-badge.verified {
            background: rgba(10, 255, 120, 0.1);
            color: #0aff78;
            border: 1px solid rgba(10, 255, 120, 0.35);
        }

        .bank-status-badge.rejected {
            background: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border: 1px solid rgba(255, 0, 60, 0.35);
        }

        /* Verify / Reject action buttons */
        .bank-verify-btn,
        .bank-reject-btn {
            font-family: 'Orbitron';
            font-size: 0.5rem;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid;
        }

        .bank-verify-btn {
            background: rgba(10, 255, 120, 0.08);
            color: #0aff78;
            border-color: rgba(10, 255, 120, 0.35);
        }

        .bank-verify-btn:hover {
            background: rgba(10, 255, 120, 0.2);
            box-shadow: 0 0 12px rgba(10, 255, 120, 0.25);
        }

        .bank-reject-btn {
            background: rgba(255, 0, 60, 0.08);
            color: #ff003c;
            border-color: rgba(255, 0, 60, 0.35);
        }

        .bank-reject-btn:hover {
            background: rgba(255, 0, 60, 0.18);
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.25);
        }

        @media (max-width: 1000px) {
            .report-strip {
                grid-template-columns: 1fr;
            }

            .strip-photo-container {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .report-main-content {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        @keyframes pulse-red {
            from {
                box-shadow: 0 0 0px #ff003c;
            }

            to {
                box-shadow: 0 0 10px #ff003c;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <a href="/index.html" class="nav-brand">
            <img src="/assets/favicon.png" alt="Logo" class="nav-main-logo" style="height: 40px;">
            <span>COFFEECREWS</span>
        </a>
        <div class="nav-links">
            <a href="/admin/index.html" class="nav-link"><i class="fas fa-th-large"></i> COCKPIT</a>
            <a href="/admin/id-card/reports.html" class="nav-link active"><i class="fas fa-tower-broadcast"></i> COMMAND
                CENTER</a>
        </div>
    </nav>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="btn-primary" onclick="triggerGlobalBroadcast()"
                    style="border-radius: 30px; padding: 10px 25px; font-size: 0.7rem;">
                    <i class="fas fa-tower-broadcast"></i> GLOBAL BROADCAST
                </button>
                <button class="btn-primary" onclick="broadcastFeatureUnlock()"
                    style="border-radius: 30px; padding: 10px 25px; font-size: 0.7rem; background: var(--accent-primary); color: #000; font-family: 'Orbitron'; cursor: pointer; border: none;">
                    <i class="fas fa-bullhorn"></i> ANNOUNCE ACHIEVEMENTS
                </button>
                <button id="seed-btn" onclick="seedDatabase()"
                    style="border-radius: 30px; padding: 10px 25px; font-size: 0.7rem; background: transparent; border: 1px solid rgba(0,243,255,0.4); color: var(--accent-primary); font-family: 'Orbitron'; cursor: pointer; transition: 0.3s;"
                    onmouseover="this.style.background='rgba(0,243,255,0.1)'"
                    onmouseout="this.style.background='transparent'">
                    <i class="fas fa-database"></i> SEED DB
                </button>
                <div id="pending-indicator" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #ff003c;">
                    <i class="fas fa-circle-exclamation"></i> <span id="pending-count">0</span> PENDING
                </div>
                <button onclick="handleLogout()"
                    style="background:transparent; border:none; color:#ff003c; cursor:pointer; font-family:'Orbitron'; font-size:0.7rem;">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>


        <!-- ═══ UPDATES: BANK/UPI FORM BROADCAST ═══ -->
        <div
            style="margin-bottom: 3rem; border: 1px solid rgba(255,150,0,0.3); border-radius: 20px; padding: 2rem; background: rgba(255,120,0,0.04);">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h3 style="font-family:'Orbitron'; font-size:0.85rem; color:#ff9900; margin:0 0 5px;"><i
                            class="fas fa-broadcast-tower"></i> UPDATES — BANK/UPI FORM BROADCAST</h3>
                    <p style="font-size:0.65rem; opacity:0.5; margin:0;">Broadcast the bank/UPI collection form to all
                        crew members. Deadline: <strong>Feb 28, 2026</strong>.</p>
                </div>
                <div style="display:flex;gap:10px;">
                    <button onclick="setBankFormBroadcast(true)"
                        style="background:rgba(0,255,120,0.1);border:1px solid #0aff78;color:#0aff78;border-radius:30px;padding:8px 18px;font-family:'Orbitron';font-size:0.6rem;cursor:pointer;transition:0.3s;">
                        <i class="fas fa-paper-plane"></i> ACTIVATE BROADCAST
                    </button>
                    <button onclick="setBankFormBroadcast(false)"
                        style="background:rgba(255,0,60,0.1);border:1px solid #ff003c;color:#ff003c;border-radius:30px;padding:8px 18px;font-family:'Orbitron';font-size:0.6rem;cursor:pointer;transition:0.3s;">
                        <i class="fas fa-stop-circle"></i> DEACTIVATE
                    </button>
                    <button onclick="loadBankSubmissions()"
                        style="background:rgba(0,243,255,0.1);border:1px solid var(--accent-primary);color:var(--accent-primary);border-radius:30px;padding:8px 18px;font-family:'Orbitron';font-size:0.6rem;cursor:pointer;transition:0.3s;">
                        <i class="fas fa-sync"></i> REFRESH SUBMISSIONS
                    </button>
                </div>
            </div>
            <!-- Status badge -->
            <div id="bank-broadcast-status"
                style="font-family:'Orbitron';font-size:0.6rem;margin-bottom:1.5rem;opacity:0.6;">Loading broadcast
                status...</div>
            <!-- Submissions table -->
            <div id="bank-submissions-table" style="overflow-x:auto;">
                <div style="opacity:0.3;font-size:0.7rem;text-align:center;padding:20px;"><i
                        class="fas fa-spinner fa-spin"></i> Load submissions by clicking REFRESH</div>
            </div>
        </div>

        <div class="reports-feed" id="reports-feed">
            <!-- Reports will be injected here -->
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="/admin/js/auth-guard.js?v=3.2"></script>
    <script src="/admin/id-card/js/data.js?v=3.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Role Check (Auth check is handled by auth-guard.js)
            const session = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') {
                location.href = '/admin/id-card/verify.html?id=' + (session.id || '');
                return;
            }

            // Real-time Reactive Sync
            DataManager.subscribeToMembers((members) => {
                cachedMembers = members;
                DataManager.subscribeToAllThreads((threads) => {
                    renderReportsUI(members, threads);
                });
            });

            window.addEventListener('storage', (e) => {
                if (e.key === 'cc_session') location.reload();
            });

            // Load broadcast status on page load
            setTimeout(() => checkBankBroadcastStatus(), 1500);
        });

        let cachedMembers = [];

        async function renderReportsUI(members, threads) {
            const feed = document.getElementById('reports-feed');
            let pending = 0;
            feed.innerHTML = '';

            const crewOnly = members.filter(m => m.access !== 'admin');
            crewOnly.forEach(m => {
                const threadId = DataManager.getThreadId(m.id, 'HQ');
                const messagesData = threads[threadId] || {};
                const history = Object.values(messagesData);

                const needsReply = history.length > 0 && history[history.length - 1].senderId !== 'HQ';
                if (needsReply) pending++;

                const recentHistory = history.slice(-2);
                const historyHtml = recentHistory.map(msg => {
                    const isHQ = msg.senderId === 'HQ';
                    let replyContextHTML = '';
                    if (msg.replyTo) {
                        replyContextHTML = `
                            <div style="background: rgba(255,255,255,0.03); border-left: 2px solid var(--accent-primary); padding: 5px 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.65rem; opacity: 0.8;">
                                <div style="font-family:'Orbitron'; color:var(--accent-primary); font-size:0.5rem;">REPLY TO: ${msg.replyTo.name}</div>
                                <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${msg.replyTo.text}</div>
                            </div>
                        `;
                    }

                    return `
                        <div style="background: ${isHQ ? 'rgba(255,255,255,0.03)' : 'rgba(0,243,255,0.05)'}; padding: 12px 15px; border-radius: 8px; margin-top: 5px; border-left: 1px solid ${isHQ ? 'rgba(255,255,255,0.1)' : 'var(--accent-primary)'};">
                            <div style="font-family: 'Orbitron'; font-size: 0.5rem; color: ${isHQ ? 'var(--text-muted)' : 'var(--accent-primary)'}; margin-bottom: 4px; letter-spacing: 1px;">
                                ${isHQ ? '<i class="fas fa-microchip"></i> HQ COMMAND' : '<i class="fas fa-user-secret"></i> AGENT TRANSMISSION'}:
                            </div>
                            ${replyContextHTML}
                            <div style="font-size: 0.8rem; color: rgba(255,255,255,0.85); line-height: 1.4;">
                                ${msg.text ? `<span>${msg.text}</span>` : ''}
                                ${msg.image ? `<img src="${msg.image}" style="max-width:140px;max-height:100px;border-radius:6px;margin-top:5px;border:1px solid rgba(0,243,255,0.2);display:block;" onclick="window.open(this.src)">` : ''}
                                ${msg.audioUrl ? `<audio controls src="${msg.audioUrl}" style="margin-top:5px;max-width:220px;"></audio>` : ''}
                                ${msg.fileUrl && (msg.fileType || '').startsWith('video/') ? `<video controls src="${msg.fileUrl}" style="max-width:220px;margin-top:5px;border-radius:6px;"></video>` : ''}
                                ${msg.fileUrl && !(msg.fileType || '').startsWith('video/') && !(msg.fileType || '').startsWith('image/') ? `<a href="${msg.fileUrl}" download="${msg.fileName || 'file'}" target="_blank" style="display:inline-flex;align-items:center;gap:8px;margin-top:5px;padding:6px 12px;background:rgba(0,243,255,0.05);border:1px solid rgba(0,243,255,0.2);border-radius:6px;color:var(--accent-primary);text-decoration:none;font-size:0.75rem;"><i class="fas fa-file-download"></i> ${msg.fileName || 'Download File'}</a>` : ''}
                                ${msg.fileUrl && (msg.fileType || '').startsWith('image/') ? `<img src="${msg.fileUrl}" style="max-width:140px;max-height:100px;border-radius:6px;margin-top:5px;border:1px solid rgba(0,243,255,0.2);display:block;" onclick="window.open(this.src)">` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                const strip = document.createElement('div');
                strip.className = 'report-strip';
                strip.innerHTML = `
                    <div class="strip-photo-container">
                        <img src="${m.image}" alt="${m.name}" class="strip-photo">
                        <div style="font-size: 0.5rem; color: #fff; font-family: 'Orbitron'; opacity: 0.3;">CC-${m.ccCode}</div>
                    </div>
                    <div class="report-main-content">
                        <div class="report-user-info">
                            <span class="report-user-role">${m.role.toUpperCase()}</span>
                            <span class="report-user-name">${m.name}</span>
                            ${needsReply ? '<div class="pending-badge"><i class="fas fa-circle-exclamation"></i> URGENT DIRECTIVE REQUIRED</div>' : ''}
                        </div>
                        <div class="report-history">
                            <div class="report-label"><i class="fas fa-database"></i> ENCRYPTED INTEL FEED</div>
                            ${historyHtml || '<div style="opacity: 0.2; font-size: 0.75rem; font-style: italic;">No active transmissions in buffer</div>'}
                        </div>
                    </div>
                    <div class="command-center-controls">
                        <div class="report-label"><i class="fas fa-tower-broadcast"></i> TRANSMIT HQ DIRECTIVE</div>
                        <textarea class="directive-input" id="reply-${m.id}" placeholder="Enter operational orders..."></textarea>
                        <button class="btn-directive" onclick="sendDirective('${m.id}')">
                            <i class="fas fa-paper-plane"></i> BROADCAST DIRECTIVE
                        </button>
                    </div>
                `;
                feed.appendChild(strip);
            });

            document.getElementById('pending-count').textContent = pending;
            gsap.from('.report-strip', { opacity: 0, y: 15, stagger: 0.08, duration: 0.5, ease: "power2.out" });
        }

        // COMMAND ACTIONS
        async function triggerGlobalBroadcast() {
            const session = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
            const msg = await tacticalPrompt("ENTER GLOBAL MISSION DIRECTIVE (Will be sent to ALL crew members):", "", "GLOBAL BROADCAST");
            if (msg && msg.trim()) {
                await window.DataManager.sendBroadcast(session.name, msg.trim());
                showToast("GLOBAL TRANSMISSION SUCCESSFUL", "success");
            }
        }

        async function handleLogout() {
            if (await tacticalConfirm("TERMINATE SECURE SESSION?", "LOGOUT SEQUENCE")) {
                sessionStorage.removeItem('cc_session');
                localStorage.removeItem('cc_session'); // Clear legacy
                location.href = '/admin/id-card/login.html';
            }
        }


        async function sendDirective(id) {
            const input = document.getElementById(`reply-${id}`);
            const text = input.value.trim();
            if (!text) return;

            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> TRANSMITTING...';

            if (await window.DataManager.sendMessage('HQ', id, text)) {
                btn.innerHTML = '<i class="fas fa-check"></i> BROADCAST SUCCESS';
                btn.style.color = '#0aff0a';
                btn.style.borderColor = '#0aff0a';
                showToast(`Directive transmitted to ${id.toUpperCase()}`, "success");

            } else {
                btn.innerHTML = originalHtml;
                showToast("Transmission failed. Check network.", "error");
            }
        }

        // ─── SEED DATABASE ────────────────────────────────────────────────────────
        async function seedDatabase() {
            const confirmed = await tacticalConfirm(
                'This will sync all member base data (name, role, access, passcode, contact) from INITIAL_MEMBERS to Firebase. Attendance and custom fields are preserved.',
                'SEED DATABASE');
            if (!confirmed) return;

            const btn = document.getElementById('seed-btn');
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SYNCING...';
            btn.disabled = true;

            try {
                const result = await window.DataManager.seedMembersToFirebase();
                showToast(`✅ ${result.msg}`, 'success', 4000);
            } catch (err) {
                console.error('Seed failed:', err);
                showToast('Seed failed. Check console for details.', 'error', 4000);
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        async function setBankFormBroadcast(active) {
            try {
                await firebase.database().ref('flags/bankFormActive').set(active);
                showToast(active ? '✅ Bank form broadcast ACTIVATED' : '🛑 Bank form broadcast DEACTIVATED', active ? 'success' : 'error', 3000);
                checkBankBroadcastStatus();
            } catch (e) {
                showToast('Firebase error: ' + e.message, 'error', 4000);
            }
        }

        async function checkBankBroadcastStatus() {
            const statusEl = document.getElementById('bank-broadcast-status');
            if (!statusEl) return;
            try {
                const snap = await firebase.database().ref('flags/bankFormActive').once('value');
                const active = snap.val() === true;
                statusEl.innerHTML = active
                    ? '<span style="color:#0aff78;"><i class="fas fa-circle" style="font-size:0.5rem;"></i> BROADCAST ACTIVE — All crew members will see the deadline banner</span>'
                    : '<span style="color:#ff003c;"><i class="fas fa-circle" style="font-size:0.5rem;"></i> BROADCAST INACTIVE — Banner hidden for all members</span>';
            } catch (e) {
                if (statusEl) statusEl.textContent = 'Status unavailable';
            }
        }

        async function loadBankSubmissions() {
            const container = document.getElementById('bank-submissions-table');
            if (!container) return;
            container.innerHTML = '<div style="opacity:0.3;font-size:0.7rem;text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            try {
                const snap = await firebase.database().ref('bankDetails').once('value');
                const data = snap.val();
                if (!data) {
                    container.innerHTML = '<div style="opacity:0.3;font-size:0.7rem;text-align:center;padding:20px;">No submissions yet.</div>';
                    return;
                }
                const rows = Object.entries(data).map(([id, v]) => ({ ...v, _firebaseId: id }));

                const statusBadge = (status) => {
                    if (status === 'verified') return '<span class="bank-status-badge verified"><i class="fas fa-check-circle"></i> VERIFIED</span>';
                    if (status === 'rejected') return '<span class="bank-status-badge rejected"><i class="fas fa-times-circle"></i> REJECTED</span>';
                    return '<span class="bank-status-badge pending"><i class="fas fa-clock"></i> PENDING</span>';
                };

                container.innerHTML = `
                    <table style="width:100%;border-collapse:collapse;font-size:0.65rem;">
                        <thead>
                            <tr style="font-family:'Orbitron';font-size:0.5rem;opacity:0.5;border-bottom:1px solid rgba(255,255,255,0.1);">
                                <th style="padding:8px;text-align:left;">NAME</th>
                                <th style="padding:8px;text-align:left;">BANK NAME</th>
                                <th style="padding:8px;text-align:left;">ACCOUNT NO</th>
                                <th style="padding:8px;text-align:left;">IFSC</th>
                                <th style="padding:8px;text-align:left;">PHONE</th>
                                <th style="padding:8px;text-align:left;">UPI ID</th>
                                <th style="padding:8px;text-align:left;">SUBMITTED</th>
                                <th style="padding:8px;text-align:left;">STATUS</th>
                                <th style="padding:8px;text-align:left;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(r => `
                                <tr id="bank-row-${r._firebaseId}" style="border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.3s;">
                                    <td style="padding:8px;color:var(--accent-primary);font-family:'Orbitron';">${r.memberName || r._firebaseId}</td>
                                    <td style="padding:8px;">${r.bankName || '—'}</td>
                                    <td style="padding:8px;">${r.accountNo || '—'}</td>
                                    <td style="padding:8px;">${r.ifsc || '—'}</td>
                                    <td style="padding:8px;">${r.phone || r.upiPhone || '—'}</td>
                                    <td style="padding:8px;">${r.upiId || '—'}</td>
                                    <td style="padding:8px;opacity:0.5;">${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '—'}</td>
                                    <td style="padding:8px;" id="bank-status-${r._firebaseId}">${statusBadge(r.status)}</td>
                                    <td style="padding:8px;">
                                        <div style="display:flex;gap:6px;flex-wrap:wrap;">
                                            <button class="bank-verify-btn" onclick="verifyBankDetails('${r._firebaseId}','${(r.memberName || r._firebaseId).replace(/'/g, "\\'")}')"
                                                ${r.status === 'verified' ? 'disabled style="opacity:0.4;cursor:default;"' : ''}>
                                                <i class="fas fa-check"></i> VERIFY
                                            </button>
                                            <button class="bank-reject-btn" onclick="rejectBankDetails('${r._firebaseId}','${(r.memberName || r._firebaseId).replace(/'/g, "\\'")}')"
                                                ${r.status === 'rejected' ? 'disabled style="opacity:0.4;cursor:default;"' : ''}>
                                                <i class="fas fa-times"></i> REJECT
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div style="margin-top:10px;font-family:'Orbitron';font-size:0.55rem;opacity:0.4;">${rows.length} submission(s) — click VERIFY or REJECT per member</div>
                `;
            } catch (e) {
                container.innerHTML = '<div style="opacity:0.3;font-size:0.7rem;padding:10px;">Error loading submissions.</div>';
            }
        }

        /* ─── VERIFY BANK DETAILS ───────────────────────────────────────────── */
        async function verifyBankDetails(memberId, memberName) {
            const confirmed = await tacticalConfirm(
                `Mark bank details submitted by ${memberName} as VERIFIED?`,
                'VERIFY BANK SUBMISSION'
            );
            if (!confirmed) return;

            try {
                await firebase.database().ref(`bankDetails/${memberId}`).update({
                    status: 'verified',
                    verifiedAt: Date.now()
                });

                // Update the badge in-place without a full reload
                const statusCell = document.getElementById(`bank-status-${memberId}`);
                if (statusCell) statusCell.innerHTML = '<span class="bank-status-badge verified"><i class="fas fa-check-circle"></i> VERIFIED</span>';

                showToast(`✅ ${memberName}'s bank details marked as VERIFIED`, 'success', 3500);
            } catch (e) {
                showToast('Firebase error: ' + e.message, 'error', 4000);
            }
        }

        /* ─── REJECT BANK DETAILS ───────────────────────────────────────────── */
        async function rejectBankDetails(memberId, memberName) {
            const reason = await tacticalPrompt(
                `Enter a rejection reason for ${memberName}'s bank submission. This will be sent to them via HQ Live Feed.`,
                'e.g. Incorrect IFSC code — please resubmit.',
                'REJECT BANK SUBMISSION'
            );
            if (!reason || !reason.trim()) return;

            try {
                // 1. Write status to Firebase
                await firebase.database().ref(`bankDetails/${memberId}`).update({
                    status: 'rejected',
                    rejectedAt: Date.now(),
                    rejectionReason: reason.trim()
                });

                // 2. Send automated HQ message to crew member's private chat
                const hqMessage = `⚠️ BANK DETAILS REJECTED\n\nYour submitted bank/UPI details have been reviewed and rejected by HQ.\n\nReason: ${reason.trim()}\n\nPlease resubmit your details via the FINANCIAL DETAILS section. If you have questions, reply to this message.`;
                await window.DataManager.sendMessage('HQ', memberId, hqMessage);

                // 3. Update badge in-place
                const statusCell = document.getElementById(`bank-status-${memberId}`);
                if (statusCell) statusCell.innerHTML = '<span class="bank-status-badge rejected"><i class="fas fa-times-circle"></i> REJECTED</span>';

                showToast(`🔴 Rejection sent to ${memberName} via HQ Live Feed`, 'error', 4000);
            } catch (e) {
                showToast('Firebase error: ' + e.message, 'error', 4000);
            }
        }

        /* ─── GLOBAL BROADCAST ─────────────────────────────────────────────── */
        async function triggerGlobalBroadcast() {
            const message = await tacticalPrompt(
                "Enter the global directive for all crew members. This will appear on everyone's HOME and STATUS feeds.",
                "e.g. Assemble for a quick standup in Room 4B at 10:30.",
                "GLOBAL HQ BROADCAST"
            );
            if (!message || !message.trim()) return;

            try {
                const adminSession = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
                const adminName = adminSession.name || 'HQ COMMAND';

                await window.DataManager.sendBroadcast(adminName, message.trim());
                showToast('🚀 GLOBAL BROADCAST TRANSMITTED', 'success', 3500);
            } catch (e) {
                console.error('Broadcast failed:', e);
                showToast('Broadcast failed: ' + e.message, 'error', 4000);
            }
        }

        /* ─── FEATURE UNLOCK BROADCAST ─────────────────────────────────────────────── */
        async function broadcastFeatureUnlock() {
            const confirmed = await tacticalConfirm(
                "Broadcast the new Achievements feature unlock to all members? Sender will be 'On time today'.",
                "FEATURE ANNOUNCEMENT"
            );
            if (!confirmed) return;

            try {
                const message = "The new Achievements feature is unlocked. Live after 7:00 PM today!";
                const senderName = "On time today";

                await window.DataManager.sendBroadcast(senderName, message);
                showToast('🚀 FEATURE ANNOUNCEMENT TRANSMITTED', 'success', 3500);
            } catch (e) {
                console.error('Broadcast failed:', e);
                showToast('Broadcast failed: ' + e.message, 'error', 4000);
            }
        }

        /* ─── LOGOUT ─────────────────────────────────────────────────────── */
        async function handleLogout() {
            if (await tacticalConfirm("TERMINATE COMMAND CENTER SESSION?", "LOGOUT SEQUENCE")) {
                sessionStorage.removeItem('cc_session');
                localStorage.removeItem('cc_session');
                location.href = '/admin/id-card/login.html';
            }
        }

    </script>
</body>

</html>
