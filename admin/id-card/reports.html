<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | CC HQ</title>
    <script src="../../mobile-redirect.js"></script>
    <link rel="stylesheet" href="/admin/id-card/css/style.css">
    <link rel="shortcut icon" href="/assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg-darker: #050505;
            --module-bg: rgba(10, 10, 10, 0.8);
            --module-border: rgba(0, 243, 255, 0.15);
            --text-muted: rgba(255, 255, 255, 0.5);
        }

        body {
            background: radial-gradient(circle at 50% -20%, #0a1012 0%, #050505 100%);
        }

        .reports-feed {
            display: flex;
            flex-direction: column;
            gap: 40px;
            margin-top: 3rem;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .report-strip {
            display: grid;
            grid-template-columns: 120px 1fr 380px;
            gap: 0;
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            background: var(--module-bg);
            border: 1px solid var(--module-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
        }

        .report-strip::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
            opacity: 0.5;
        }

        .report-strip:hover {
            border-color: rgba(0, 243, 255, 0.4);
        }

        .strip-photo-container {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .strip-photo {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .report-main-content {
            padding: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .report-user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            margin-bottom: 20px;
        }

        .report-user-name {
            font-family: 'Orbitron';
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .report-user-role {
            font-size: 0.6rem;
            color: var(--accent-primary);
            letter-spacing: 2.5px;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .command-center-controls {
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .report-label {
            font-family: 'Orbitron';
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-label i {
            font-size: 0.7rem;
            color: var(--accent-primary);
        }

        .directive-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px;
            color: #fff;
            padding: 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            resize: none;
            transition: 0.3s;
        }

        .directive-input:focus {
            border-color: var(--accent-primary) !important;
            background: rgba(0, 243, 255, 0.03) !important;
        }

        .btn-directive {
            width: 100%;
            height: 45px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-family: 'Orbitron';
            letter-spacing: 1px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-directive:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .pending-badge {
            background: rgba(255, 0, 60, 0.1);
            color: #ff003c;
            border: 1px solid rgba(255, 0, 60, 0.3);
            font-size: 0.55rem;
            font-family: 'Orbitron';
            padding: 4px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            animation: pulse-red-soft 2s infinite;
        }

        @keyframes pulse-red-soft {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        @media (max-width: 1000px) {
            .report-strip {
                grid-template-columns: 1fr;
            }

            .strip-photo-container {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .report-main-content {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        @keyframes pulse-red {
            from {
                box-shadow: 0 0 0px #ff003c;
            }

            to {
                box-shadow: 0 0 10px #ff003c;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <a href="/index.html" class="nav-brand">
            <img src="/assets/favicon.png" alt="Logo" class="nav-main-logo" style="height: 40px;">
            <span>COFFEECREWS</span>
        </a>
        <div class="nav-links">
            <a href="/admin/index.html" class="nav-link"><i class="fas fa-th-large"></i> COCKPIT</a>
            <a href="/admin/id-card/reports.html" class="nav-link active"><i class="fas fa-tower-broadcast"></i> COMMAND
                CENTER</a>
        </div>
    </nav>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <button class="btn-primary" onclick="triggerGlobalBroadcast()"
                    style="border-radius: 30px; padding: 10px 25px; font-size: 0.7rem;">
                    <i class="fas fa-tower-broadcast"></i> GLOBAL BROADCAST
                </button>
                <button id="seed-btn" onclick="seedDatabase()"
                    style="border-radius: 30px; padding: 10px 25px; font-size: 0.7rem; background: transparent; border: 1px solid rgba(0,243,255,0.4); color: var(--accent-primary); font-family: 'Orbitron'; cursor: pointer; transition: 0.3s;"
                    onmouseover="this.style.background='rgba(0,243,255,0.1)'"
                    onmouseout="this.style.background='transparent'">
                    <i class="fas fa-database"></i> SEED DB
                </button>
                <div id="pending-indicator" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #ff003c;">
                    <i class="fas fa-circle-exclamation"></i> <span id="pending-count">0</span> PENDING
                </div>
                <button onclick="handleLogout()"
                    style="background:transparent; border:none; color:#ff003c; cursor:pointer; font-family:'Orbitron'; font-size:0.7rem;">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>


        <div class="reports-feed" id="reports-feed">
            <!-- Reports will be injected here -->
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script src="/admin/js/auth-guard.js?v=3.2"></script>
    <script src="/admin/id-card/js/data.js?v=3.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Role Check (Auth check is handled by auth-guard.js)
            const session = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') {
                location.href = '/admin/id-card/verify.html?id=' + (session.id || '');
                return;
            }

            // Real-time Reactive Sync
            DataManager.subscribeToMembers((members) => {
                cachedMembers = members;
                DataManager.subscribeToAllThreads((threads) => {
                    renderReportsUI(members, threads);
                });
            });

            window.addEventListener('storage', (e) => {
                if (e.key === 'cc_session') location.reload();
            });
        });

        let cachedMembers = [];

        async function renderReportsUI(members, threads) {
            const feed = document.getElementById('reports-feed');
            let pending = 0;
            feed.innerHTML = '';

            const crewOnly = members.filter(m => m.access !== 'admin');
            crewOnly.forEach(m => {
                const threadId = DataManager.getThreadId(m.id, 'HQ');
                const messagesData = threads[threadId] || {};
                const history = Object.values(messagesData);

                const needsReply = history.length > 0 && history[history.length - 1].senderId !== 'HQ';
                if (needsReply) pending++;

                const recentHistory = history.slice(-2);
                const historyHtml = recentHistory.map(msg => {
                    const isHQ = msg.senderId === 'HQ';
                    return `
                        <div style="background: ${isHQ ? 'rgba(255,255,255,0.03)' : 'rgba(0,243,255,0.05)'}; padding: 12px 15px; border-radius: 8px; margin-top: 5px; border-left: 1px solid ${isHQ ? 'rgba(255,255,255,0.1)' : 'var(--accent-primary)'};">
                            <div style="font-family: 'Orbitron'; font-size: 0.5rem; color: ${isHQ ? 'var(--text-muted)' : 'var(--accent-primary)'}; margin-bottom: 4px; letter-spacing: 1px;">
                                ${isHQ ? '<i class="fas fa-microchip"></i> HQ COMMAND' : '<i class="fas fa-user-secret"></i> AGENT TRANSMISSION'}:
                            </div>
                        <div style="font-size: 0.8rem; color: rgba(255,255,255,0.85); line-height: 1.4;">
                                ${msg.text ? `<span>${msg.text}</span>` : ''}
                                ${msg.image ? `<img src="${msg.image}" style="max-width:140px;max-height:100px;border-radius:6px;margin-top:5px;border:1px solid rgba(0,243,255,0.2);display:block;" onclick="window.open(this.src)">` : ''}
                                ${msg.audioUrl ? `<audio controls src="${msg.audioUrl}" style="margin-top:5px;max-width:220px;"></audio>` : ''}
                                ${msg.fileUrl && (msg.fileType || '').startsWith('video/') ? `<video controls src="${msg.fileUrl}" style="max-width:220px;margin-top:5px;border-radius:6px;"></video>` : ''}
                                ${msg.fileUrl && !(msg.fileType || '').startsWith('video/') && !(msg.fileType || '').startsWith('image/') ? `<a href="${msg.fileUrl}" download="${msg.fileName || 'file'}" target="_blank" style="display:inline-flex;align-items:center;gap:8px;margin-top:5px;padding:6px 12px;background:rgba(0,243,255,0.05);border:1px solid rgba(0,243,255,0.2);border-radius:6px;color:var(--accent-primary);text-decoration:none;font-size:0.75rem;"><i class="fas fa-file-download"></i> ${msg.fileName || 'Download File'}</a>` : ''}
                                ${msg.fileUrl && (msg.fileType || '').startsWith('image/') ? `<img src="${msg.fileUrl}" style="max-width:140px;max-height:100px;border-radius:6px;margin-top:5px;border:1px solid rgba(0,243,255,0.2);display:block;" onclick="window.open(this.src)">` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                const strip = document.createElement('div');
                strip.className = 'report-strip';
                strip.innerHTML = `
                    <div class="strip-photo-container">
                        <img src="${m.image}" alt="${m.name}" class="strip-photo">
                        <div style="font-size: 0.5rem; color: #fff; font-family: 'Orbitron'; opacity: 0.3;">CC-${m.ccCode}</div>
                    </div>
                    <div class="report-main-content">
                        <div class="report-user-info">
                            <span class="report-user-role">${m.role.toUpperCase()}</span>
                            <span class="report-user-name">${m.name}</span>
                            ${needsReply ? '<div class="pending-badge"><i class="fas fa-circle-exclamation"></i> URGENT DIRECTIVE REQUIRED</div>' : ''}
                        </div>
                        <div class="report-history">
                            <div class="report-label"><i class="fas fa-database"></i> ENCRYPTED INTEL FEED</div>
                            ${historyHtml || '<div style="opacity: 0.2; font-size: 0.75rem; font-style: italic;">No active transmissions in buffer</div>'}
                        </div>
                    </div>
                    <div class="command-center-controls">
                        <div class="report-label"><i class="fas fa-tower-broadcast"></i> TRANSMIT HQ DIRECTIVE</div>
                        <textarea class="directive-input" id="reply-${m.id}" placeholder="Enter operational orders..."></textarea>
                        <button class="btn-directive" onclick="sendDirective('${m.id}')">
                            <i class="fas fa-paper-plane"></i> BROADCAST DIRECTIVE
                        </button>
                    </div>
                `;
                feed.appendChild(strip);
            });

            document.getElementById('pending-count').textContent = pending;
            gsap.from('.report-strip', { opacity: 0, y: 15, stagger: 0.08, duration: 0.5, ease: "power2.out" });
        }

        // COMMAND ACTIONS
        async function triggerGlobalBroadcast() {
            const session = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
            const msg = await tacticalPrompt("ENTER GLOBAL MISSION DIRECTIVE (Will be sent to ALL crew members):", "", "GLOBAL BROADCAST");
            if (msg && msg.trim()) {
                await window.DataManager.sendBroadcast(session.name, msg.trim());
                showToast("GLOBAL TRANSMISSION SUCCESSFUL", "success");
            }
        }

        async function handleLogout() {
            if (await tacticalConfirm("TERMINATE SECURE SESSION?", "LOGOUT SEQUENCE")) {
                sessionStorage.removeItem('cc_session');
                localStorage.removeItem('cc_session'); // Clear legacy
                location.href = '/admin/id-card/login.html';
            }
        }


        async function sendDirective(id) {
            const input = document.getElementById(`reply-${id}`);
            const text = input.value.trim();
            if (!text) return;

            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> TRANSMITTING...';

            if (await window.DataManager.sendMessage('HQ', id, text)) {
                btn.innerHTML = '<i class="fas fa-check"></i> BROADCAST SUCCESS';
                btn.style.color = '#0aff0a';
                btn.style.borderColor = '#0aff0a';
                showToast(`Directive transmitted to ${id.toUpperCase()}`, "success");

            } else {
                btn.innerHTML = originalHtml;
                showToast("Transmission failed. Check network.", "error");
            }
        }

        // ─── SEED DATABASE ────────────────────────────────────────────────────────
        async function seedDatabase() {
            const confirmed = await tacticalConfirm(
                'This will sync all member base data (name, role, access, passcode, contact) from INITIAL_MEMBERS to Firebase. Attendance and custom fields are preserved.',
                'SEED DATABASE');
            if (!confirmed) return;

            const btn = document.getElementById('seed-btn');
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SYNCING...';
            btn.disabled = true;

            try {
                const result = await window.DataManager.seedMembersToFirebase();
                showToast(`✅ ${result.msg}`, 'success', 4000);
            } catch (err) {
                console.error('Seed failed:', err);
                showToast('Seed failed. Check console for details.', 'error', 4000);
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

    </script>
</body>

</html>
