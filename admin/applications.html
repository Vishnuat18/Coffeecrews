<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Center | COFFEECREWS Admin</title>
    <link rel="shortcut icon" href="/assets/favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-color: #050508;
            --bg-secondary: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #00f3ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
        }

        .header-bar {
            padding: 2rem 5%;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-group h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--accent-primary);
        }

        .app-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .app-card {
            margin-bottom: 1.5rem;
            padding: 20px;
            transition: 0.3s;
        }

        .app-card:hover {
            border-color: var(--accent-primary);
            transform: translateX(10px);
        }

        .badge-role {
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            font-family: 'Orbitron';
            font-size: 0.6rem;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .btn-action {
            padding: 8px 15px;
            border-radius: 4px;
            font-family: 'Orbitron';
            font-size: 0.6rem;
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            transition: 0.3s;
            text-decoration: none;
        }

        .btn-action:hover {
            background: var(--accent-primary);
            color: #000;
        }

        .btn-delete {
            border-color: #ff003c;
            color: #ff003c;
        }

        .btn-delete:hover {
            background: #ff003c;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="header-bar glass">
        <div class="title-group">
            <span
                style="font-size: 0.6rem; letter-spacing: 3px; color: var(--accent-primary); text-transform: uppercase;">Talent
                Acquisition</span>
            <h1>Recruitment Center</h1>
        </div>
        <a href="index.html" class="btn-action"><i class="fas fa-arrow-left"></i> BACK TO COCKPIT</a>
    </div>

    <div class="app-container">
        <div id="sync-status" class="mb-4 d-flex align-items-center gap-2"
            style="font-family: 'Orbitron'; font-size: 0.6rem; opacity: 0.5;">
            <div
                style="width: 8px; height: 8px; background: #3cff7d; border-radius: 50%; box-shadow: 0 0 10px #3cff7d;">
            </div>
            LIVE RECRUITMENT FEED // <span id="sync-time">SYNCING...</span>
        </div>

        <div id="applications-feed">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/admin/js/auth-guard.js?v=2.4"></script>
    <script src="/admin/id-card/js/data.js?v=2.4"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(sessionStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') {
                location.href = '/admin/id-card/verify.html?id=' + (session.id || '');
                return;
            }

            DataManager.subscribeToApplications((apps) => {
                renderApplications(apps);
                updateSync();
            });
        });

        function updateSync() {
            document.getElementById('sync-time').textContent = new Date().toLocaleTimeString();
        }

        function renderApplications(apps) {
            const container = document.getElementById('applications-feed');
            if (apps.length === 0) {
                container.innerHTML = '<div class="glass p-5 text-center opacity-50">NO ACTIVE APPLICATIONS IN PIPELINE</div>';
                return;
            }

            container.innerHTML = apps.map(app => `
                <div class="glass app-card animate-slide">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="badge-role mb-2 d-inline-block">${app.role.toUpperCase()}</span>
                            <h2 style="font-size: 1.2rem; margin: 0;">${app.name}</h2>
                            <p style="font-size: 0.8rem; opacity: 0.6; margin: 5px 0;">${app.email} // ${app.phone || 'N/A'}</p>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.6rem; opacity: 0.4; font-family: 'Orbitron';">${app.timestamp}</div>
                        </div>
                    </div>
                    <div class="mt-3 p-3 glass" style="background: rgba(255,255,255,0.02); font-size: 0.8rem;">
                        <strong>PITCH:</strong> ${app.message || 'No additional details provided.'}
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <a href="mailto:${app.email}" class="btn-action">CONTACT CANDIDATE</a>
                        <button onclick="deleteApp('${app.id}')" class="btn-action btn-delete">PURGE RECORD</button>
                    </div>
                </div>
            `).join('');

            gsap.from('.animate-slide', {
                x: -30,
                opacity: 0,
                stagger: 0.1,
                duration: 0.5
            });
        }

        async function deleteApp(id) {
            if (await tacticalConfirm("Permanently purge this recruitment record?", "RECRUITMENT PURGE")) {
                await DataManager.deleteApplication(id);
                showToast("Application record purged.", "success");
            }
        }
    </script>
</body>

</html>
