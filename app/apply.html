<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apply | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>
    <style>
        .apply-step {
            display: none;
        }

        .apply-step.active {
            display: block;
        }

        .step-indicator {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            flex: 1;
        }

        .step-indicator.active {
            background: var(--accent-primary);
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="location.href='home.html'">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">RECRUITMENT</span>
        </div>
    </header>

    <main class="app-container">
        <section style="padding: 100px 20px 20px;">
            <div style="display: flex; gap: 5px; margin-bottom: 20px;">
                <div class="step-indicator active"></div>
                <div class="step-indicator" id="step2-ind"></div>
                <div class="step-indicator" id="step3-ind"></div>
            </div>
            <span class="section-label">UNIT DEPLOYMENT</span>
            <h1 class="orbitron" style="font-size: 1.8rem; margin-bottom: 1rem;">JOIN THE<br><span
                    style="color: var(--accent-primary);">COALITION</span></h1>
        </section>

        <section style="padding: 0 20px 40px;">
            <div id="step1" class="apply-step active">
                <div class="glass" style="padding: 25px; border-radius: 20px;">
                    <h3 class="orbitron" style="font-size: 0.8rem; margin-bottom: 20px;">PERSONAL INTEL</h3>
                    <input type="text" class="input-mobile" placeholder="Full Name"
                        style="width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff;">
                    <input type="email" class="input-mobile" placeholder="Strategic Email"
                        style="width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: #fff;">
                    <button onclick="nextStep(2)" class="btn-directive" style="width: 100%; padding: 18px;">NEXT
                        PHASE</button>
                </div>
            </div>

            <div id="step2" class="apply-step">
                <div class="glass" style="padding: 25px; border-radius: 20px;">
                    <h3 class="orbitron" style="font-size: 0.8rem; margin-bottom: 20px;">SKILL MATRIX</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                        <div class="glass"
                            style="padding: 15px; border-radius: 10px; text-align: center; font-size: 0.6rem;">FRONTEND
                        </div>
                        <div class="glass"
                            style="padding: 15px; border-radius: 10px; text-align: center; font-size: 0.6rem;">BACKEND
                        </div>
                        <div class="glass"
                            style="padding: 15px; border-radius: 10px; text-align: center; font-size: 0.6rem;">
                            BLOCKCHAIN</div>
                        <div class="glass"
                            style="padding: 15px; border-radius: 10px; text-align: center; font-size: 0.6rem;">AI/ML
                        </div>
                    </div>
                    <button onclick="nextStep(3)" class="btn-directive" style="width: 100%; padding: 18px;">FINAL
                        VERIFICATION</button>
                </div>
            </div>

            <div id="step3" class="apply-step">
                <div class="glass" style="padding: 25px; border-radius: 20px; text-align: center;">
                    <i class="fas fa-check-circle"
                        style="font-size: 3rem; color: var(--accent-primary); margin-bottom: 20px;"></i>
                    <h3 class="orbitron" style="font-size: 1rem; margin-bottom: 10px;">MISSION RECEIVED</h3>
                    <p style="font-size: 0.8rem; opacity: 0.7; line-height: 1.6;">Your application has been logged into
                        the secure HQ database. Our tactical recruiters will contact you soon.</p>
                    <button onclick="location.href='home.html'" class="btn-directive"
                        style="width: 100%; padding: 18px; margin-top: 30px;">RETURN TO FRONT</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav glass">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>START</span>
        </a>
        <a href="portfolio.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>WORK</span>
        </a>
        <a href="services.html" class="nav-item">
            <i class="fas fa-ghost"></i>
            <span>MIND</span>
        </a>
        <a href="login.html" class="nav-item">
            <i class="fas fa-lock"></i>
            <span>PORTAL</span>
        </a>
    </nav>

    <script>
        function nextStep(n) {
            if (n === 3) {
                // Collect basic data from mobile inputs
                const inputs = document.querySelectorAll('.input-mobile');
                const appData = {
                    name: inputs[0].value || 'Anonymous Mobile',
                    email: inputs[1].value || 'not-provided@mobile.cc',
                    role: 'Mobile Applicant',
                    stack: 'General Tech',
                    timestamp: new Date().toLocaleString()
                };
                window.DataManager.submitApplication(appData);
            }

            document.querySelectorAll('.apply-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            if (n >= 2) document.getElementById('step2-ind').classList.add('active');
            if (n >= 3) document.getElementById('step3-ind').classList.add('active');

            gsap.from('#step' + n, { x: 50, opacity: 0, duration: 0.5 });
        }
    </script>
</body>

</html>
