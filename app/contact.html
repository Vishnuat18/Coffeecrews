<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contact | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="/app/css/mobile.css">
    <link rel="stylesheet" href="/app/css/public-mobile.css">
    <style>
        .contact-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            font-family: inherit;
            margin-bottom: 20px;
            outline: none;
        }

        .contact-input:focus {
            border-color: var(--accent-primary);
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="location.href='/app/home.html'">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">COMMUNICATIONS</span>
        </div>
    </header>

    <main class="app-container">
        <section style="padding: 100px 20px 20px;">
            <span class="section-label">SECURE UPLINK</span>
            <h1 class="orbitron" style="font-size: 1.8rem;">INITIATE<br><span
                    style="color: var(--accent-primary);">CONTACT</span></h1>
        </section>

        <section style="padding: 0 20px 40px;">
            <div class="glass" style="padding: 25px; border-radius: 20px;">
                <input type="text" class="contact-input" placeholder="Operative Name">
                <input type="email" class="contact-input" placeholder="Secure Email">
                <textarea class="contact-input" style="height: 120px;" placeholder="Transmission Details..."></textarea>
                <button class="btn-directive" style="width: 100%; padding: 18px;">TRANSMIT SECURE UPLINK</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;">
                <a href="mailto:admin@coffeecrews.com" class="glass"
                    style="padding: 20px; text-align: center; border-radius: 20px; color: #fff; text-decoration: none;">
                    <i class="fas fa-envelope"
                        style="font-size: 1.5rem; color: var(--accent-primary); margin-bottom: 10px;"></i>
                    <div class="orbitron" style="font-size: 0.6rem;">EMAIL HQ</div>
                </a>
                <a href="tel:+1234567890" class="glass"
                    style="padding: 20px; text-align: center; border-radius: 20px; color: #fff; text-decoration: none;">
                    <i class="fas fa-phone"
                        style="font-size: 1.5rem; color: var(--accent-secondary); margin-bottom: 10px;"></i>
                    <div class="orbitron" style="font-size: 0.6rem;">VOICE SECURE</div>
                </a>
            </div>
        </section>
    </main>

    <nav class="bottom-nav glass">
        <a href="/app/home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>START</span>
        </a>
        <a href="/app/portfolio.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>WORK</span>
        </a>
        <a href="/app/services.html" class="nav-item">
            <i class="fas fa-ghost"></i>
            <span>MIND</span>
        </a>
        <a href="/app/login.html" class="nav-item">
            <i class="fas fa-lock"></i>
            <span>PORTAL</span>
        </a>
    </nav>

    <script src="/app/main.js"></script>
</body>

</html>
