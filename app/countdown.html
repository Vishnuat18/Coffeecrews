<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Countdown | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="../admin/id-card/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">
    <style>
        .timer-unit {
            text-align: center;
        }

        .timer-val {
            font-size: 2.5rem;
            font-family: 'Orbitron';
            background: linear-gradient(180deg, var(--accent-primary), #fff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .timer-label {
            font-size: 0.5rem;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="history.back()">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">MISSION WINDOW</span>
        </div>
    </header>

    <main class="app-container"
        style="display: flex; flex-direction: column; justify-content: center; height: 100vh; padding-bottom: 80px;">
        <section style="text-align: center; padding: 20px;">
            <span class="section-label">NEXT DROP IMMINENT</span>
            <h1 class="orbitron" style="font-size: 1.2rem; margin-bottom: 40px; color: #fff;">COFFEE ACCESS KEY</h1>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px;">
                <div class="glass timer-unit" style="padding: 20px; border-radius: 15px;">
                    <div class="timer-val" id="days">00</div>
                    <div class="timer-label">DAYS</div>
                </div>
                <div class="glass timer-unit" style="padding: 20px; border-radius: 15px;">
                    <div class="timer-val" id="hours">00</div>
                    <div class="timer-label">HOURS</div>
                </div>
                <div class="glass timer-unit" style="padding: 20px; border-radius: 15px;">
                    <div class="timer-val" id="minutes">00</div>
                    <div class="timer-label">MINS</div>
                </div>
                <div class="glass timer-unit" style="padding: 20px; border-radius: 15px;">
                    <div class="timer-val" id="seconds">00</div>
                    <div class="timer-label">SECS</div>
                </div>
            </div>

            <div class="glass"
                style="margin-top: 40px; padding: 20px; border-radius: 15px; border: 1px dashed var(--accent-primary);">
                <p style="font-size: 0.7rem; opacity: 0.6; line-height: 1.6;">OPERATIVE NOTICE: Prepare your unit for
                    high-velocity deployment. The next CoffeeCrews innovation is finalizing synchronization.</p>
            </div>

            <button onclick="location.href='apply.html'" class="btn-directive"
                style="margin-top: 40px; width: 100%; padding: 18px;">NOTIFY MY UNIT</button>
        </section>
    </main>

    <nav class="bottom-nav glass">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>START</span>
        </a>
        <a href="portfolio.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>WORK</span>
        </a>
        <a href="services.html" class="nav-item">
            <i class="fas fa-ghost"></i>
            <span>MIND</span>
        </a>
        <a href="login.html" class="nav-item">
            <i class="fas fa-lock"></i>
            <span>PORTAL</span>
        </a>
    </nav>

    <script>
        const targetDate = new Date().getTime() + (7 * 24 * 60 * 60 * 1000); // 7 days from now

        setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>

</html>
