<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SECURE ENTRY | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="../admin/id-card/assets/favicon.png">

    <!-- External Assets -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Mobile Logic & Styles -->
    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .login-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #101010, #000);
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px var(--accent-primary));
        }

        .code-display {
            display: flex;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .code-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1.5px solid var(--accent-primary);
            transition: 0.2s;
        }

        .code-dot.filled {
            background: var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-primary);
        }

        #auth-status {
            font-family: 'Orbitron';
            font-size: 0.65rem;
            color: var(--accent-secondary);
            margin-top: 1rem;
            height: 1rem;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="login-screen">
        <img src="../admin/id-card/assets/favicon.png" class="auth-logo" alt="CC">

        <h2 class="orbitron" style="font-size: 0.8rem; margin-bottom: 0.5rem; opacity: 0.6;">PERSONNEL IDENTIFICATION
        </h2>
        <div id="auth-status"></div>

        <div class="code-display" id="code-dots">
            <div class="code-dot"></div>
            <div class="code-dot"></div>
            <div class="code-dot"></div>
            <div class="code-dot"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="press('1')">1</div>
            <div class="key" onclick="press('2')">2</div>
            <div class="key" onclick="press('3')">3</div>
            <div class="key" onclick="press('4')">4</div>
            <div class="key" onclick="press('5')">5</div>
            <div class="key" onclick="press('6')">6</div>
            <div class="key" onclick="press('7')">7</div>
            <div class="key" onclick="press('8')">8</div>
            <div class="key" onclick="press('9')">9</div>
            <div class="key" style="opacity: 0.3;"><i class="fas fa-fingerprint"></i></div>
            <div class="key" onclick="press('0')">0</div>
            <div class="key" onclick="back()"><i class="fas fa-backspace"></i></div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>

    <script>
        let code = "";
        const dots = document.querySelectorAll('.code-dot');

        function press(num) {
            if (code.length < 4) {
                code += num;
                updateDots();
                if (code.length === 4) attemptLogin();
            }
        }

        function back() {
            code = code.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            dots.forEach((dot, i) => {
                dot.classList.toggle('filled', i < code.length);
            });
        }

        async function attemptLogin() {
            const status = document.getElementById('auth-status');
            status.innerText = "VERIFYING CRYPTO-CODE...";
            status.style.color = "var(--accent-primary)";

            const member = await window.DataManager.verifyCode(code);
            if (member) {
                status.innerText = "ACCESS GRANTED";
                localStorage.setItem('cc_session', JSON.stringify({
                    id: member.id,
                    name: member.name,
                    role: member.role || 'crew',
                    timestamp: Date.now()
                }));

                gsap.to('body', {
                    opacity: 0, duration: 0.5, onComplete: () => {
                        location.href = `workspace.html?id=${member.id}`;
                    }
                });
            } else {
                status.innerText = "INVALID CODE - ACCESS DENIED";
                status.style.color = "var(--accent-secondary)";
                code = "";
                updateDots();
                gsap.from('.code-display', { x: 10, repeat: 3, yoyo: true, duration: 0.05 });
            }
        }
    </script>
</body>

</html>
