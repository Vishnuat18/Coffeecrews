<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Display | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">
    <style>
        .display-card {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .data-label {
            font-size: 0.5rem;
            opacity: 0.4;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .data-val {
            font-family: 'Orbitron';
            font-size: 0.8rem;
        }
    </style>
</head>

<body style="background: #000;">
    <main class="app-container"
        style="display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
        <div id="display-content" class="glass display-card"
            style="width: 100%; max-width: 400px; padding: 40px; border-radius: 30px; text-align: center;">
            <div id="loader-inner">
                <i class="fas fa-dna fa-spin" style="color: var(--accent-primary); font-size: 2rem;"></i>
            </div>

            <div id="content-inner" style="display: none;">
                <img id="d-image" src=""
                    style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--accent-primary); margin-bottom: 20px;">
                <h1 id="d-name" class="orbitron" style="font-size: 1.5rem; color: #fff; margin-bottom: 5px;">---</h1>
                <div id="d-role"
                    style="font-size: 0.7rem; color: var(--accent-primary); letter-spacing: 4px; margin-bottom: 30px;">
                    ROLE: ---</div>

                <div
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div>
                        <div class="data-label">UNIT ID</div>
                        <div class="data-val" id="d-id">---</div>
                    </div>
                    <div>
                        <div class="data-label">STATUS</div>
                        <div class="data-val" id="d-status" style="color: #00ff00;">LIVE</div>
                    </div>
                </div>

                <button onclick="history.back()" class="btn-directive"
                    style="margin-top: 40px; width: 100%; font-size: 0.6rem;">CLOSE PREVIEW</button>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>

    <script>
        let memberId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!memberId) { location.href = 'home.html'; return; }

            const member = await window.DataManager.getMemberById(memberId);
            if (member) {
                document.getElementById('d-image').src = member.image;
                document.getElementById('d-name').innerText = member.name.toUpperCase();
                document.getElementById('d-role').innerText = `ROLE: ${member.role.toUpperCase()}`;
                document.getElementById('d-id').innerText = member.id;
                document.getElementById('d-status').innerText = (member.status || 'ACTIVE').toUpperCase();

                document.getElementById('loader-inner').style.display = 'none';
                document.getElementById('content-inner').style.display = 'block';
                gsap.from('#content-inner', { scale: 0.9, opacity: 0, duration: 0.6 });
            }
        });
    </script>
</body>

</html>
