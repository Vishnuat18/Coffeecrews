<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COCKPIT | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <style>
        .cockpit-card {
            margin: 15px;
            padding: 20px;
            border-radius: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 15px;
        }

        .action-chip {
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-family: 'Orbitron';
            text-transform: uppercase;
        }

        .chip-approve {
            background: rgba(10, 255, 10, 0.1);
            border: 1px solid #0aff0a;
            color: #0aff0a;
        }

        .chip-reject {
            background: rgba(255, 10, 10, 0.1);
            border: 1px solid #ff0a0a;
            color: #ff0a0a;
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-microchip" style="color: var(--accent-primary); font-size: 1.2rem;"></i>
            <span class="header-title">MANAGEMENT COCKPIT</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div id="sync-indicator"
                style="width: 6px; height: 6px; background: #3cff7d; border-radius: 50%; box-shadow: 0 0 10px #3cff7d;">
            </div>
            <span id="sync-time" style="font-size: 0.5rem; opacity: 0.4; font-family: 'Orbitron';">LIVE</span>
        </div>
    </header>

    <div class="app-container" style="padding-top: 70px;">
        <div class="stat-grid">
            <div class="glass" style="padding: 15px; border-radius: 15px;">
                <div style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">TOTAL CREW</div>
                <div class="orbitron" id="stat-total" style="font-size: 1.2rem; color: var(--accent-primary);">0</div>
            </div>
            <div class="glass" style="padding: 15px; border-radius: 15px;">
                <div style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">OPEN APPS</div>
                <div class="orbitron" id="stat-apps" style="font-size: 1.2rem; color: var(--accent-secondary);">0</div>
            </div>
            <div class="glass" style="padding: 15px; border-radius: 15px; border-color: var(--accent-gold);">
                <div style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">ON-DUTY</div>
                <div class="orbitron" id="stat-attendance" style="font-size: 1.2rem; color: var(--accent-gold);">0</div>
            </div>
        </div>

        <h3 class="orbitron" style="font-size: 0.7rem; margin: 25px 15px 15px; opacity: 0.4;">PERSONNEL REQUESTS</h3>
        <div id="requests-list"></div>

        <h3 class="orbitron" style="font-size: 0.7rem; margin: 25px 15px 15px; opacity: 0.4;">ACTIVE ROSTER</h3>
        <div id="roster-list"></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav glass" id="mobile-nav">
        <a href="workspace.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>MY UNIT</span>
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = JSON.parse(localStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') {
                location.href = 'login.html';
                return;
            }

            setupDynamicNav();

            // --- REAL-TIME SUBSCRIBERS ---

            // 1. Members & Stats
            DataManager.subscribeToMembers((members) => {
                renderRoster(members);
                document.getElementById('stat-total').innerText = members.length;
                updateSync();
            });

            // 2. Applications
            DataManager.subscribeToApplications((apps) => {
                document.getElementById('stat-apps').innerText = apps.length;
                updateSync();
            });

            // 3. Attendance
            DataManager.subscribeToDailyAttendance((list) => {
                document.getElementById('stat-attendance').innerText = list.length;
                updateSync();
            });

            // 4. Security Requests
            DataManager.subscribeToPasscodeRequests((requests) => {
                renderRequests(requests);
                updateSync();
            });

            // GSAP entrance
            gsap.from('.header-mobile', { y: -50, opacity: 0, duration: 0.8, ease: 'power3.out' });
            gsap.from('.bottom-nav', { y: 100, opacity: 0, duration: 0.8, ease: 'power3.out' });
        });

        function updateSync() {
            const now = new Date();
            document.getElementById('sync-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            gsap.fromTo('#sync-indicator', { opacity: 0.2 }, { opacity: 1, duration: 0.5 });
        }

        function setupDynamicNav() {
            const nav = document.getElementById('mobile-nav');
            const session = JSON.parse(localStorage.getItem('cc_session'));
            nav.innerHTML += `
                <a href="workspace.html?id=${session.id}#chats" class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span>CHATS</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-tower-broadcast"></i>
                    <span>REPORTS</span>
                </a>
                <a href="admin.html" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>COCKPIT</span>
                </a>
            `;
        }

        async function renderRequests(requests) {
            const reqList = document.getElementById('requests-list');
            const pendingReqs = requests.filter(r => r.status === 'pending');

            if (pendingReqs.length === 0) {
                reqList.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.3; font-size:0.7rem;">CLEARED: NO PENDING REQUESTS</div>';
                return;
            }

            reqList.innerHTML = pendingReqs.map(r => `
                <div class="glass cockpit-card">
                    <div style="font-family:'Orbitron'; font-size:0.7rem; margin-bottom:10px;">AUTH REQUEST: ${r.memberName}</div>
                    <div style="font-size:0.6rem; opacity:0.6; margin-bottom:15px;">Target CC Code: ${r.newPass}</div>
                    <div style="display:flex; gap:10px;">
                        <button onclick="approve('${r.id}')" class="action-chip chip-approve">APPROVE</button>
                        <button onclick="reject('${r.id}')" class="action-chip chip-reject">REJECT</button>
                    </div>
                </div>
            `).join('');
        }

        async function renderRoster(members) {
            const roster = document.getElementById('roster-list');
            roster.innerHTML = members.map(m => `
                <div class="glass cockpit-card" style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
                    <img src="${m.image}" class="profile-img-mobile">
                    <div>
                        <div class="orbitron" style="font-size:0.75rem;">${m.name}</div>
                        <div style="font-size:0.6rem; opacity:0.5;">${m.role.toUpperCase()} // CC-${m.ccCode}</div>
                    </div>
                    <i class="fas fa-ellipsis-v" style="margin-left:auto; opacity:0.3;"></i>
                </div>
            `).join('');
        }

        async function approve(id) {
            if (confirm("APPROVE SECURITY REQUEST?")) {
                const res = await window.DataManager.approvePasscodeRequest(id);
                showToast(res.message, "success");
            }
        }

        async function reject(id) {
            if (confirm("REJECT SECURITY REQUEST?")) {
                const res = await window.DataManager.rejectPasscodeRequest(id);
                showToast(res.message, "error");
            }
        }
    </script>
</body>

</html>
