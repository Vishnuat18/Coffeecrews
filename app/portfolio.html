<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portfolio | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="location.href='home.html'">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">TECH REPOSITORY</span>
        </div>
    </header>

    <main class="app-container">
        <section style="padding: 100px 20px 20px;">
            <span class="section-label">THE STACK</span>
            <h1 class="orbitron" style="font-size: 1.8rem;">INNOVATION<br><span
                    style="color: var(--accent-primary);">ARCHIVE</span></h1>
        </section>

        <!-- Horizontal Swipe Products -->
        <h3 class="orbitron" style="font-size: 0.6rem; margin: 20px 20px 0; opacity: 0.4;">FLAGSHIP PRODUCTS</h3>
        <div class="swipe-container" id="products-swipe">
            <div class="portfolio-card-mobile glass">
                <img src="../assets/products/chitly.jpg" class="portfolio-img" alt="Chitly">
                <div class="portfolio-info">
                    <div class="orbitron" style="font-size: 0.8rem; color: var(--accent-primary);">CHITLY</div>
                    <div style="font-size: 0.6rem; opacity: 0.6;">ADVANCED COMMUNICATION</div>
                </div>
            </div>
            <div class="portfolio-card-mobile glass">
                <img src="../assets/products/ix.jpg" class="portfolio-img" alt="IX">
                <div class="portfolio-info">
                    <div class="orbitron" style="font-size: 0.8rem; color: var(--accent-primary);">IX PLATFORM</div>
                    <div style="font-size: 0.6rem; opacity: 0.6;">ECOSYSTEM CONTROL</div>
                </div>
            </div>
        </div>

        <!-- Vertical List Projects -->
        <section style="padding: 0 20px 40px;">
            <h3 class="orbitron" style="font-size: 0.6rem; margin-bottom: 15px; opacity: 0.4;">STRATEGIC PROJECTS</h3>
            <div class="feature-stack" style="padding: 0;">
                <div class="glass"
                    style="padding: 20px; border-radius: 15px; display: flex; align-items: center; gap: 15px;">
                    <i class="fas fa-university" style="color: var(--accent-primary);"></i>
                    <div>
                        <div class="orbitron" style="font-size: 0.75rem;">BANKING CORE</div>
                        <div style="font-size: 0.6rem; opacity: 0.5;">Scale-up Infrastructure</div>
                    </div>
                </div>
                <div class="glass"
                    style="padding: 20px; border-radius: 15px; display: flex; align-items: center; gap: 15px;">
                    <i class="fas fa-heartbeat" style="color: var(--accent-secondary);"></i>
                    <div>
                        <div class="orbitron" style="font-size: 0.75rem;">HELTHCARE SYNC</div>
                        <div style="font-size: 0.6rem; opacity: 0.5;">Data Interoperability</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav glass">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>START</span>
        </a>
        <a href="portfolio.html" class="nav-item active">
            <i class="fas fa-layer-group"></i>
            <span>WORK</span>
        </a>
        <a href="services.html" class="nav-item">
            <i class="fas fa-ghost"></i>
            <span>MIND</span>
        </a>
        <a href="login.html" class="nav-item">
            <i class="fas fa-lock"></i>
            <span>PORTAL</span>
        </a>
    </nav>

    <script src="main.js"></script>
    <script>
        gsap.from('.portfolio-card-mobile', { x: 50, opacity: 0, stagger: 0.2, duration: 0.8 });
    </script>
</body>

</html>
