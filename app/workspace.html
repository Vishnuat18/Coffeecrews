<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WORKSPACE | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <!-- External Assets -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Mobile Logic & Styles -->
    <link rel="stylesheet" href="/app/css/mobile.css">
    <style>
        .page-screen {
            display: none;
            height: 100vh;
            overflow-y: auto;
            padding-top: 60px;
            /* Header space */
        }

        .page-screen.active {
            display: block;
        }

        .header-mobile {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .header-title {
            font-family: 'Orbitron';
            font-size: 0.75rem;
            color: var(--accent-primary);
        }

        /* Mission Log Styles */
        .mission-item {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 15px;
            border-left: 3px solid var(--accent-primary);
        }

        /* Profile Header */
        .profile-hdr {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(0, 243, 255, 0.05), transparent);
        }
    </style>
</head>

<body>
    <div id="loader" class="glass"
        style="position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
        <img src="/admin/id-card/assets/favicon.png" style="width:50px; animation: pulse 1.5s infinite;" alt="CC">
        <div class="orbitron" style="font-size: 0.6rem; letter-spacing: 2px;">SYNCING OPERATIVE DATA...</div>
    </div>

    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img id="p-photo-small" src="" class="profile-img-mobile" alt="">
            <span class="header-title" id="page-label">COMMAND CENTER</span>
        </div>
        <div style="display: flex; gap: 15px; font-size: 1rem;">
            <i class="fas fa-tower-broadcast" style="color: var(--accent-secondary);"></i>
            <i class="fas fa-wifi" style="color: var(--accent-primary);"></i>
        </div>
    </header>

    <div class="app-container">
        <!-- SCREEN: HOME -->
        <section id="screen-home" class="page-screen active">
            <div class="profile-hdr">
                <h1 class="orbitron" id="p-name" style="font-size: 1.2rem; margin-bottom: 0.5rem;">...</h1>
                <p id="p-role" style="font-size: 0.7rem; opacity: 0.6; letter-spacing: 2px;"></p>

                <div style="display: flex; justify-content: center; gap: 20px; margin-top: 2rem;">
                    <div class="glass" style="padding: 10px 20px; border-radius: 12px;">
                        <div style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">RANK</div>
                        <div class="orbitron" style="font-size: 0.7rem; color: var(--accent-primary);" id="p-rank">
                            OPERATIVE</div>
                    </div>
                    <div class="glass" style="padding: 10px 20px; border-radius: 12px;">
                        <div style="font-size: 0.5rem; opacity: 0.5; margin-bottom: 5px;">UNIT ID</div>
                        <div class="orbitron" style="font-size: 0.7rem; color: var(--accent-primary);" id="p-unit">...
                        </div>
                    </div>
                </div>
            </div>

            <div style="padding: 0 20px;">
                <h3 class="orbitron" style="font-size: 0.7rem; margin: 20px 0 15px; opacity: 0.4;">MISSION TELEMETRY
                </h3>
                <div id="home-telemetry"></div>
            </div>
        </section>

        <!-- SCREEN: CHATS -->
        <section id="screen-chats" class="page-screen">
            <!-- Top Tabs for Chats -->
            <div style="display: flex; padding: 10px 20px; gap: 10px; border-bottom: 1px solid var(--glass-border);">
                <button onclick="switchChatType('hq')" class="chat-tab-btn active" id="btn-hq">HQ</button>
                <button onclick="switchChatType('global')" class="chat-tab-btn" id="btn-global">GLOBAL</button>
                <button onclick="switchChatType('crew')" class="chat-tab-btn" id="btn-crew">CREW</button>
            </div>

            <!-- HQ Chat -->
            <div id="chat-hq" class="chat-channel-mobile active">
                <div id="feed-hq" class="mobile-chat-feed" style="height: 60vh;"></div>
                <div class="mobile-input-bar glass">
                    <input type="text" id="input-hq" placeholder="Report to HQ..."
                        onkeypress="if(event.key==='Enter') send('hq')">
                    <i class="fas fa-paper-plane" style="color: var(--accent-primary);" onclick="send('hq')"></i>
                </div>
            </div>

            <!-- Global Chat -->
            <div id="chat-global" class="chat-channel-mobile" style="display: none;">
                <div id="feed-global" class="mobile-chat-feed" style="height: 60vh;"></div>
                <div class="mobile-input-bar glass">
                    <input type="text" id="input-global" placeholder="Broadcast to all..."
                        onkeypress="if(event.key==='Enter') send('global')">
                    <i class="fas fa-paper-plane" style="color: var(--accent-primary);" onclick="send('global')"></i>
                </div>
            </div>

            <!-- Crew Chat -->
            <div id="chat-crew" class="chat-channel-mobile" style="display: none;">
                <div id="crew-list" class="mobile-chat-feed"></div>
                <div id="active-peer" style="display: none;">
                    <div id="feed-peer" class="mobile-chat-feed" style="height: 55vh;"></div>
                    <div class="mobile-input-bar glass">
                        <input type="text" id="input-peer" placeholder="Secure transmit..."
                            onkeypress="if(event.key==='Enter') send('peer')">
                        <i class="fas fa-paper-plane" style="color: var(--accent-primary);" onclick="send('peer')"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- SCREEN: STATUS -->
        <section id="screen-status" class="page-screen">
            <div style="padding: 20px;">
                <h2 class="orbitron" style="font-size: 0.9rem; margin-bottom: 1.5rem;">MISSION LOG ENTRY</h2>
                <div class="glass status-card">
                    <textarea id="status-input" class="directive-input"
                        placeholder="Draft your objectives / progress..."
                        style="min-height: 150px; background:transparent; border:none; width:100%; color:#fff; font-family:inherit; outline:none; font-size:0.8rem;"></textarea>
                    <button onclick="commitToFeed()" class="btn-directive" style="margin-top: 20px; width: 100%;">
                        <i class="fas fa-cloud-upload-alt"></i> COMMIT TO GLOBAL OPS
                    </button>
                </div>
            </div>
        </section>

        <!-- SCREEN: PROFILE -->
        <section id="screen-profile" class="page-screen">
            <div style="padding: 20px;">
                <div class="glass" style="padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                    <div class="orbitron" style="font-size: 0.6rem; opacity: 0.5; margin-bottom: 15px;">SECURITY
                        PROTOCOLS</div>
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <button onclick="requestPasscodeChange()" class="glass"
                            style="padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; color: #fff;">
                            <span><i class="fas fa-key"></i> Passcode Request</span>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <button onclick="window.open('/admin/id-card/display.html?id=' + activeMember.id)" class="glass"
                            style="padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; color: #fff;">
                            <span><i class="fas fa-id-card"></i> View Digital ID</span>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <button onclick="logout()" class="glass"
                    style="width: 100%; padding: 15px; color: var(--accent-secondary); border-radius: 15px; font-family: 'Orbitron'; font-size: 0.7rem;">
                    TERMINATE SESSION
                </button>
            </div>
        </section>
    </div>

    <nav class="bottom-nav glass" id="mobile-nav">
        <a href="#" class="nav-item active" onclick="nav('home')">
            <i class="fas fa-home"></i>
            <span>HOME</span>
        </a>
        <a href="#" class="nav-item" onclick="nav('chats')">
            <i class="fas fa-comments"></i>
            <span>CHATS</span>
        </a>
        <a href="#" class="nav-item" onclick="nav('status')">
            <i class="fas fa-file-signature"></i>
            <span>MISSION</span>
        </a>
        <a href="#" class="nav-item" onclick="nav('profile')">
            <i class="fas fa-user-shield"></i>
            <span>PROFILE</span>
        </a>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/admin/id-card/js/data.js"></script>

    <script>
        let activeMember = null;
        let activePeerId = null;
        let currentScreen = 'home';
        let currentChatType = 'hq';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const session = JSON.parse(localStorage.getItem('cc_session') || '{}');

            if (!session.id || session.id !== id) {
                location.href = '/app/login.html';
                return;
            }

            activeMember = await window.DataManager.getMemberById(id);
            if (!activeMember) {
                location.href = '/app/login.html';
                return;
            }

            renderBaseInfo();
            initSync();
            setupDynamicNav();

            // GSAP Entrance
            gsap.from('.header-mobile', { y: -50, opacity: 0, duration: 0.8, ease: 'power3.out' });
            gsap.from('.bottom-nav', { y: 100, opacity: 0, duration: 0.8, ease: 'power3.out' });
            gsap.from('.page-screen.active', { opacity: 0, scale: 0.95, duration: 0.8, ease: 'power3.out' });

            // Hide loader
            gsap.to('#loader', { opacity: 0, delay: 0.5, onComplete: () => document.getElementById('loader').style.display = 'none' });
        });

        function setupDynamicNav() {
            const nav = document.getElementById('mobile-nav');
            const session = JSON.parse(localStorage.getItem('cc_session'));
            if (session.role === 'admin') {
                nav.innerHTML += `
                    <a href="/app/reports.html" class="nav-item">
                        <i class="fas fa-tower-broadcast"></i>
                        <span>REPORTS</span>
                    </a>
                    <a href="/app/admin.html" class="nav-item">
                        <i class="fas fa-th-large"></i>
                        <span>COCKPIT</span>
                    </a>
                `;
            }
        }

        function renderBaseInfo() {
            document.getElementById('p-name').innerText = activeMember.name;
            document.getElementById('p-role').innerText = activeMember.role;
            document.getElementById('p-photo-small').src = activeMember.image;
            document.getElementById('p-unit').innerText = `CC-${activeMember.ccCode}`;
        }

        function nav(screen) {
            currentScreen = screen;
            document.querySelectorAll('.page-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${screen}`).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');

            const labels = { home: 'COMMAND CENTER', chats: 'SECURE COMMS', status: 'MISSION LOG', profile: 'SECURITY' };
            document.getElementById('page-label').innerText = labels[screen];

            if (screen === 'home') renderHomeTelemetry();
            if (screen === 'chats') renderChats();
        }

        function switchChatType(type) {
            currentChatType = type;
            document.querySelectorAll('.chat-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type}`).classList.add('active');

            document.querySelectorAll('.chat-channel-mobile').forEach(c => c.style.display = 'none');
            document.getElementById(`chat-${type}`).style.display = 'block';

            if (type === 'crew') renderCrewList();
        }

        // Renamed and modified to be a UI rendering function, called by subscriber
        function renderHomeTelemetryUI(feed) {
            const container = document.getElementById('home-telemetry');
            if (!container) return;
            container.innerHTML = feed.slice(0, 5).map(item => `
                <div class="glass mission-item">
                    <div style="font-size: 0.6rem; color: var(--accent-primary); font-family: 'Orbitron'; margin-bottom: 5px;">${item.senderName} // ${item.time || ''}</div>
                    <div style="font-size: 0.8rem;">${item.text}</div>
                </div>
            `).join('');
        }

        function initSync() {
            // 1. Live HQ Chat
            const threadId = window.DataManager.getThreadId(activeMember.id, 'HQ');
            window.DataManager.subscribeToChat(threadId, (messages) => {
                renderMessagesHTML('feed-hq', messages, activeMember.id, { HQ: 'HQ COMMAND', [activeMember.id]: activeMember.name });
            });

            // 2. Live Global Chat
            window.DataManager.subscribeToGlobalChat((messages) => {
                renderMessagesHTML('feed-global', messages, activeMember.id);
            });

            // 3. Live Mission Telemetry (Status Feed)
            window.DataManager.subscribeToStatusFeed((feed) => {
                renderHomeTelemetryUI(feed);
            });

            // 4. Live Profile Sync
            window.DataManager.subscribeToMembers((members) => {
                const me = members.find(m => m.id === activeMember.id);
                if (me) {
                    activeMember = me;
                    renderBaseInfo();
                }
            });
        }

        function renderMessagesHTML(containerId, messages, myId, context = {}) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = messages.map(msg => {
                const sId = msg.senderId || msg.sender;
                const isSelf = sId === myId;
                const sName = context[sId] || msg.senderName || sId;
                return `
                    <div class="chat-bubble ${isSelf ? 'bubble-self' : 'bubble-other'}">
                        <span class="bubble-meta">${sName} // ${msg.time || ''}</span>
                        <div>${msg.text}</div>
                    </div>
                `;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function renderCrewList() {
            const members = await window.DataManager.getAllMembers();
            const container = document.getElementById('crew-list');
            const others = members.filter(m => m.id !== activeMember.id);

            container.innerHTML = others.map(m => `
                <div class="glass" onclick="startPeer('${m.id}', '${m.name}')" style="display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 12px; margin-bottom: 10px;">
                    <img src="${m.image}" class="profile-img-mobile">
                    <div class="orbitron" style="font-size: 0.75rem;">${m.name}</div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; opacity: 0.3;"></i>
                </div>
            `).join('');
        }

        function startPeer(id, name) {
            activePeerId = id;
            document.getElementById('crew-list').style.display = 'none';
            document.getElementById('active-peer').style.display = 'block';

            const threadId = window.DataManager.getThreadId(activeMember.id, id);
            window.DataManager.subscribeToChat(threadId, (messages) => {
                renderMessagesHTML('feed-peer', messages, activeMember.id, { [id]: name, [activeMember.id]: activeMember.name });
            });
        }

        async function send(type) {
            const input = document.getElementById(`input-${type}`);
            const text = input.value.trim();
            if (!text) return;

            let success = false;
            if (type === 'hq') success = await window.DataManager.sendMessage(activeMember.id, 'HQ', text);
            if (type === 'global') success = await window.DataManager.sendGlobalMessage(activeMember.id, activeMember.name, text);
            if (type === 'peer') success = await window.DataManager.sendMessage(activeMember.id, activePeerId, text);

            if (success) input.value = '';
        }

        async function commitToFeed() {
            const text = document.getElementById('status-input').value.trim();
            if (!text) return;
            if (await window.DataManager.commitStatus(activeMember.id, activeMember.name, text, activeMember.image)) {
                document.getElementById('status-input').value = '';
                showToast("SYCHRONIZED TO GLOBAL OPS", "success");
                nav('home');
            }
        }

        function logout() {
            if (confirm("TERMINATE CONNECTION?")) {
                localStorage.removeItem('cc_session');
                location.href = '/app/login.html';
            }
        }
    </script>

    <style>
        .chat-tab-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Orbitron';
            font-size: 0.6rem;
            padding: 8px 15px;
            transition: 0.3s;
            border-radius: 10px;
        }

        .chat-tab-btn.active {
            background: rgba(0, 243, 255, 0.1);
            color: var(--accent-primary);
        }

        .chat-channel-mobile {
            padding-bottom: 100px;
        }

        .btn-directive {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            font-family: 'Orbitron';
            padding: 12px;
            border-radius: 12px;
            font-size: 0.7rem;
        }
    </style>
</body>

</html>
