<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crew | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="history.back()">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">COOPERATIVE ROSTER</span>
        </div>
    </header>

    <main class="app-container">
        <section style="padding: 100px 20px 20px;">
            <span class="section-label">ELITE OPERATIVES</span>
            <h1 class="orbitron" style="font-size: 1.8rem; margin-bottom: 1.5rem;">THE<br><span
                    style="color: var(--accent-primary);">CREW</span></h1>

            <div class="glass"
                style="padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <i class="fas fa-search" style="opacity: 0.4;"></i>
                <input type="text" placeholder="Search Operative ID..."
                    style="background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 0.8rem;">
            </div>
        </section>

        <section style="padding: 0 20px 100px;" id="crew-list">
            <!-- Driven by DataManager -->
            <div class="glass"
                style="padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
                <img src="../admin/id-card/assets/vishnu.png"
                    style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--accent-primary);">
                <div>
                    <div class="orbitron" style="font-size: 0.9rem;">VISHNU</div>
                    <div style="font-size: 0.6rem; color: var(--accent-primary); letter-spacing: 1px;">SUPREME COMMANDER
                    </div>
                    <div style="font-size: 0.5rem; opacity: 0.5; margin-top: 5px;">HQ OPERATIVE</div>
                </div>
                <div style="margin-left: auto;">
                    <div
                        style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00;">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav glass">
        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>START</span>
        </a>
        <a href="portfolio.html" class="nav-item">
            <i class="fas fa-layer-group"></i>
            <span>WORK</span>
        </a>
        <a href="services.html" class="nav-item">
            <i class="fas fa-ghost"></i>
            <span>MIND</span>
        </a>
        <a href="login.html" class="nav-item">
            <i class="fas fa-lock"></i>
            <span>PORTAL</span>
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const members = await window.DataManager.getAllMembers();
            const list = document.getElementById('crew-list');

            list.innerHTML = members.map(m => `
                <div class="glass" style="padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
                    <img src="${m.image}" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid ${m.role === 'admin' ? 'var(--accent-primary)' : 'rgba(255,255,255,0.1)'}">
                    <div>
                        <div class="orbitron" style="font-size: 0.9rem;">${m.name}</div>
                        <div style="font-size: 0.6rem; color: var(--accent-primary); letter-spacing: 1px;">${m.role.toUpperCase()}</div>
                        <div style="font-size: 0.5rem; opacity: 0.5; margin-top: 5px;">UNIT ID: ${m.id}</div>
                    </div>
                    <div style="margin-left: auto;">
                        <div style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00;"></div>
                    </div>
                </div>
            `).join('');

            gsap.from('.glass', { y: 20, opacity: 0, stagger: 0.1, duration: 0.8 });
        });
    </script>
</body>

</html>
