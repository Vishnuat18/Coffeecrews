<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COMMAND CENTER | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="/app/css/mobile.css">
    <style>
        .report-card {
            margin: 15px;
            padding: 20px;
            border-radius: 20px;
            position: relative;
        }

        .pending-badge {
            background: var(--accent-secondary);
            color: #fff;
            font-size: 0.5rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Orbitron';
        }

        .history-snippet {
            font-size: 0.75rem;
            margin-top: 10px;
            opacity: 0.7;
            padding-left: 10px;
            border-left: 2px solid var(--accent-primary);
        }

        .reply-sheet {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            padding: 40px 20px;
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-tower-broadcast" style="color: var(--accent-secondary); font-size: 1.2rem;"></i>
            <span class="header-title">COMMAND CENTER</span>
        </div>
        <div id="pending-count" class="pending-badge" style="font-size: 0.7rem;">0 PENDING</div>
    </header>

    <div class="app-container" style="padding-top: 70px;">
        <div style="padding: 0 15px; margin-bottom: 20px;">
            <button onclick="globalBroadcast()" class="glass"
                style="width: 100%; padding: 15px; border-radius: 15px; color: var(--accent-primary); font-family: 'Orbitron'; font-size: 0.7rem;">
                <i class="fas fa-bullhorn"></i> SEND GLOBAL DIRECTIVE
            </button>
        </div>

        <div id="reports-list"></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav glass" id="mobile-nav">
        <a href="/app/workspace.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>MY UNIT</span>
        </a>
    </nav>

    <!-- Reply Slide-up Overlay -->
    <div id="reply-overlay" class="reply-sheet">
        <div style="display: flex; justify-content: space-between; margin-bottom: 30px;">
            <h2 class="orbitron" id="reply-to-name" style="font-size: 0.9rem;">...</h2>
            <i class="fas fa-times" onclick="closeReply()" style="font-size: 1.5rem;"></i>
        </div>
        <textarea id="reply-input" placeholder="Enter HQ orders..."
            style="width: 100%; height: 200px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; color: #fff; font-family: inherit; font-size: 1rem; outline: none;"></textarea>
        <button onclick="sendReply()" class="btn-directive"
            style="width: 100%; margin-top: 20px; padding: 18px; font-size: 0.8rem;">
            <i class="fas fa-paper-plane"></i> TRANSMIT DIRECTIVE
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/admin/id-card/js/data.js"></script>

    <script>
        let currentTargetId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const session = JSON.parse(localStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') {
                location.href = '/app/login.html';
                return;
            }

            setupDynamicNav();

            // --- REAL-TIME REACTIVE SYNC ---
            DataManager.subscribeToMembers((members) => {
                DataManager.subscribeToAllThreads((threads) => {
                    renderReportsUI(members, threads);
                });
            });

            // GSAP Entrance
            gsap.from('.header-mobile', { y: -50, opacity: 0, duration: 0.8, ease: 'power3.out' });
            gsap.from('.bottom-nav', { y: 100, opacity: 0, duration: 0.8, ease: 'power3.out' });
        });

        function setupDynamicNav() {
            const nav = document.getElementById('mobile-nav');
            nav.innerHTML += `
                <a href="#" class="nav-item" onclick="navTo('chats')">
                    <i class="fas fa-comments"></i>
                    <span>CHATS</span>
                </a>
                <a href="/app/reports.html" class="nav-item active">
                    <i class="fas fa-tower-broadcast"></i>
                    <span>REPORTS</span>
                </a>
                <a href="/app/admin.html" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>COCKPIT</span>
                </a>
            `;
        }

        function navTo(tab) {
            const session = JSON.parse(localStorage.getItem('cc_session'));
            location.href = `/app/workspace.html?id=${session.id}#${tab}`;
        }

        async function renderReportsUI(members, threads) {
            const container = document.getElementById('reports-list');
            let pending = 0;

            const cards = members.map(m => {
                const threadId = window.DataManager.getThreadId(m.id, 'HQ');
                const messagesData = threads[threadId] || {};
                const history = Object.values(messagesData);
                const lastMsg = history.length > 0 ? history[history.length - 1] : null;
                const needsReply = lastMsg && lastMsg.senderId !== 'HQ';

                if (needsReply) pending++;

                return `
                    <div class="glass report-card" onclick="openReply('${m.id}', '${m.name}')">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${m.image}" class="profile-img-mobile">
                            <div>
                                <div class="orbitron" style="font-size: 0.75rem;">${m.name}</div>
                                <div style="font-size: 0.6rem; opacity: 0.5;">${m.role.toUpperCase()}</div>
                            </div>
                            ${needsReply ? '<div class="pending-badge" style="margin-left: auto;">PENDING</div>' : ''}
                        </div>
                        <div class="history-snippet">
                            ${lastMsg ? `"${lastMsg.text}"` : 'No active transmissions'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = cards.join('');
            document.getElementById('pending-count').innerText = `${pending} PENDING`;
            gsap.from('.report-card', { opacity: 0, y: 10, stagger: 0.05, duration: 0.4 });
        }

        function openReply(id, name) {
            currentTargetId = id;
            document.getElementById('reply-to-name').innerText = `HQ DIRECTIVE TO: ${name}`;
            document.getElementById('reply-overlay').style.display = 'block';
            gsap.from('#reply-overlay', { y: '100%', duration: 0.4, ease: 'power2.out' });
        }

        function closeReply() {
            gsap.to('#reply-overlay', {
                y: '100%', duration: 0.3, onComplete: () => {
                    document.getElementById('reply-overlay').style.display = 'none';
                }
            });
        }

        async function sendReply() {
            const text = document.getElementById('reply-input').value.trim();
            if (!text) return;

            if (await window.DataManager.sendMessage('HQ', currentTargetId, text)) {
                document.getElementById('reply-input').value = '';
                closeReply();
            }
        }

        async function globalBroadcast() {
            const msg = prompt("ENTER GLOBAL MISSION DIRECTIVE:");
            if (msg && msg.trim()) {
                const session = JSON.parse(localStorage.getItem('cc_session'));
                await window.DataManager.sendBroadcast(session.name, msg.trim());
                alert("GLOBAL TRANSMISSION SUCCESSFUL");
            }
        }
    </script>
</body>

</html>
