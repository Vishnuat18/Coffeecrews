<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Edit Operative | CoffeeCrews Mobile</title>
    <link rel="shortcut icon" href="../admin/id-card/assets/favicon.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/public-mobile.css">
    <style>
        .edit-label {
            font-size: 0.6rem;
            color: var(--accent-primary);
            margin-bottom: 8px;
            font-family: 'Orbitron';
        }

        .edit-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header class="header-mobile glass">
        <div style="display: flex; align-items: center; gap: 10px;" onclick="history.back()">
            <i class="fas fa-arrow-left" style="color: var(--accent-primary);"></i>
            <span class="header-title">UNIT MODIFICATION</span>
        </div>
    </header>

    <main class="app-container">
        <section style="padding: 100px 20px 100px;">
            <div id="loader-inner" style="text-align: center; padding: 40px;">
                <i class="fas fa-circle-notch fa-spin" style="color: var(--accent-primary); font-size: 2rem;"></i>
            </div>

            <div id="edit-form" style="display: none;">
                <div style="text-align: center; margin-bottom: 30px;">
                    <img id="m-image" src=""
                        style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-primary); margin-bottom: 10px;">
                    <div class="orbitron" id="m-id" style="font-size: 0.7rem; opacity: 0.5;">UNIT: ---</div>
                </div>

                <div class="edit-label">OPERATIVE NAME</div>
                <input type="text" id="name" class="edit-input">

                <div class="edit-label">STRATEGIC ROLE</div>
                <input type="text" id="role" class="edit-input">

                <div class="edit-label">DEPLOYMENT STATUS</div>
                <select id="status" class="edit-input" style="appearance: none;">
                    <option value="active">ACTIVE</option>
                    <option value="standby">STANDBY</option>
                    <option value="archived">ARCHIVED</option>
                </select>

                <button onclick="saveChanges()" class="btn-directive"
                    style="width: 100%; padding: 18px; margin-top: 10px;">SAVE MODIFICATIONS</button>
            </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="../admin/id-card/js/data.js"></script>

    <script>
        let memberId = new URLSearchParams(window.location.search).get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            const session = JSON.parse(localStorage.getItem('cc_session') || '{}');
            if (session.role !== 'admin') { location.href = 'login.html'; return; }

            if (!memberId) { alert("NO UNIT SPECIFIED"); history.back(); return; }

            const member = await window.DataManager.getMemberById(memberId);
            if (member) {
                document.getElementById('m-image').src = member.image;
                document.getElementById('m-id').innerText = `UNIT: ${member.id}`;
                document.getElementById('name').value = member.name;
                document.getElementById('role').value = member.role;
                document.getElementById('status').value = member.status || 'active';

                document.getElementById('loader-inner').style.display = 'none';
                document.getElementById('edit-form').style.display = 'block';
                gsap.from('#edit-form', { opacity: 0, y: 10 });
            }
        });

        async function saveChanges() {
            const updates = {
                name: document.getElementById('name').value,
                role: document.getElementById('role').value,
                status: document.getElementById('status').value
            };

            await window.DataManager.updateMember(memberId, updates);
            alert("UNIT DATA SYNCHRONIZED");
            history.back();
        }
    </script>
</body>

</html>
